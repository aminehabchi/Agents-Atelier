<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/static/logo.svg" type="image/svg+xml">
<meta name="theme-color" content="#0f1117">
<title>New project · Agents Atelier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/static/base.css">
<link rel="stylesheet" href="/static/site.css">
<script src="/static/i18n.js"></script>
<script src="/static/icons.js"></script>
<script src="/static/ui.js"></script>
<style>
  .page { padding-top: 16px; padding-bottom: 16px; }
  .wrap { max-width: 1320px; }
  .crumb { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--graphite); text-decoration: none; border-radius: var(--r); padding: 2px 0; }
  .crumb:hover { color: var(--ink); }
  .crumb .ic { transform: rotate(180deg); }
  [dir="rtl"] .crumb .ic { transform: none; }          /* "back" points to the right in a right-to-left page */
  .page-head { margin-bottom: 16px; }
  .page-head .crumb { margin-bottom: 6px; }
  .page-title { font-size: 32px; margin: 0; }
  .page-head .lead { margin: 6px 0 0; font-size: 14px; line-height: 1.5; color: var(--stone); max-width: 70ch; }
  .page-head .lead b { color: var(--ink); font-weight: 500; }
  #form-host { background: var(--paper); border: 1px solid var(--line-strong); border-radius: var(--r); box-shadow: var(--hard); padding: 20px 24px 0; min-width: 0; }
  #form-host .loading { margin: 0; padding: 40px 0 60px; text-align: center; color: var(--stone); font-size: 14px; }

  /* every field in one view: what the agents must know on the start side, what helps them on the other */
  #form-host form { display: grid; grid-template-columns: minmax(0, 4fr) minmax(0, 7fr); gap: 0; }
  #form-host .pf-main { min-width: 0; padding-inline-end: 28px; }
  #form-host .pf-more { min-width: 0; padding-inline-start: 28px; border-inline-start: 1px solid var(--line); }
  /* the required fields stay in view while you fill in the long optional side */
  @media (min-width: 1001px) and (min-height: 700px) {
    #form-host .pf-main { position: sticky; top: 84px; align-self: start; }
  }
  /* Cancel and Create stay at hand at the bottom of the screen, however long the form gets */
  #form-host .row { grid-column: 1 / -1; display: flex; gap: 8px; justify-content: flex-end; align-items: center; margin: 8px -24px 0; padding: 12px 24px;
    border-top: 1px solid var(--line); position: sticky; bottom: 0; z-index: 3; background: var(--paper); border-radius: 0 0 var(--r-card) var(--r-card); }
  #form-host .pfield { margin-bottom: 10px; gap: 4px; }
  #form-host .input { padding-top: 7px; padding-bottom: 7px; }
  #form-host .pfield textarea { min-height: 60px; }
  #form-host textarea[name="description"] { min-height: 84px; }
  #form-host textarea[name="pages"] { min-height: 62px; }
  #form-host .pgrid select.input { height: 38px; font-size: 14px; }
  #form-host .pgroup { border-top: 0; margin: 0 0 6px; padding: 0; min-width: 0; }
  #form-host .pgroup + .pgroup { margin-top: 2px; }
  #form-host .pgroup legend { margin-bottom: 6px; }
  #form-host .pfield > span { flex-wrap: wrap; gap: 0 12px; }
  #form-host .pfield.off { opacity: .45; }
  #form-host .src-summary { line-height: 1.4; }
  #form-host .src-files { flex-wrap: wrap; }
  #form-host [aria-invalid="true"] { box-shadow: inset 0 0 0 1.5px var(--danger); }
  #form-host button[value="ok"]:disabled { opacity: .7; cursor: progress; }
  @media (max-width: 1000px) {
    #form-host form { grid-template-columns: minmax(0, 1fr); }
    #form-host .pf-main { padding-inline-end: 0; margin-bottom: 8px; }
    #form-host .pf-more { padding-inline-start: 0; border-inline-start: 0; padding-top: 14px; border-top: 1px solid var(--line); }
    #form-host textarea[name="description"] { min-height: 110px; }
  }
  @media (max-width: 560px) {
    .page-title { font-size: 28px; }
    #form-host { padding: 18px 16px 0; box-shadow: var(--hard-sm); }
    #form-host .row { margin-inline: -16px; padding: 12px 16px; }
    #form-host .row > * { flex: 1 1 0; justify-content: center; }
  }
</style>
<link rel="stylesheet" href="/static/theme.css">
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="logo" href="/"><span class="mark"><i data-icon="logo" data-size="18"></i></span>Agents Atelier</a>
    <nav class="links">
      <a href="/projects" class="on"><i data-icon="grid" data-size="16"></i>Projects</a>
      <a href="/agents"><i data-icon="users" data-size="16"></i>My agents</a>
      <a href="/teams"><i data-icon="layers" data-size="16"></i>My teams</a>
    </nav>
    <span></span>
  </div>
</header>
<main class="wrap page">
  <div class="page-head">
    <a class="crumb" href="/projects"><i data-icon="arrow-right" data-size="14"></i>All projects</a>
    <h1 class="page-title">New project</h1>
    <p class="lead">Only the <b>name</b> and <b>description</b> are required. Everything else is optional and brings the first build closer to what you have in mind.</p>
  </div>
  <div id="form-host" aria-busy="true"><p class="loading">Loading…</p></div>
</main>
<script>
const host = document.getElementById("form-host");
let dirty = false, saving = false;
host.addEventListener("input", () => { dirty = true; });
host.addEventListener("change", () => { dirty = true; });
window.addEventListener("beforeunload", (e) => { if (dirty && !saving) e.preventDefault(); });   // long form: don't lose it to a stray click

(async () => {
// The brand kit section only shows when it gets its sources (your other projects' kits to copy from): [] still shows it.
let brandSources = [];
try { brandSources = await api("/api/brand/sources"); } catch {}
host.removeAttribute("aria-busy");
const form = fillProjectForm(host, { allowImport: true, askAssets: true, heading: false, cancelHref: "/projects", brandSources }, async (details, e) => {
  e.preventDefault();
  const go = host.querySelector('button[value="ok"]');
  if (go.disabled) return;
  go.disabled = true;
  go.textContent = "Creating…";
  host.setAttribute("aria-busy", "true");
  saving = true;                        // createProject opens the studio when it works
  await createProject(details);
  saving = false;                       // still here: it failed and has said why, so the answers stay for another try
  go.disabled = false;
  go.textContent = "Create project";
  host.removeAttribute("aria-busy");
});
form.focus();
})();
</script>
</body>
</html>
