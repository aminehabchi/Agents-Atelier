<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/static/logo.svg" type="image/svg+xml">
<meta name="theme-color" content="#f7f7f5">
<title>Agents · Agents Atelier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/static/base.css">
<link rel="stylesheet" href="/static/site.css">
<script src="/static/icons.js"></script>
<script src="/static/ui.js"></script>
<style>
  .layout { display: grid; grid-template-columns: 340px 1fr; gap: 24px; margin-top: 0; align-items: start; }
  .side { position: sticky; top: 88px; background: var(--paper); border-radius: 24px; box-shadow: var(--ring); padding: 10px; max-height: calc(100vh - 110px); display: flex; flex-direction: column; }
  .side .head { display: flex; align-items: center; justify-content: space-between; padding: 10px 10px 8px; font-size: 13px; color: var(--stone); }
  .alist { overflow-y: auto; display: flex; flex-direction: column; gap: 2px; padding: 2px; }
  .aitem { display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 6px; border-radius: 14px; cursor: pointer; border: 1px solid transparent; background: none; text-align: left; width: 100%; }
  .aitem:hover { background: var(--linen); }
  .aitem.on { background: var(--bone); }
  .aitem.dragging { opacity: .4; }
  .aitem.drop-before { box-shadow: 0 -2px 0 var(--ink); }
  .aitem.drop-after { box-shadow: 0 2px 0 var(--ink); }
  .grip { color: var(--line-strong); cursor: grab; display: grid; place-items: center; width: 14px; }
  .aitem:hover .grip { color: var(--stone); }
  .num { font: 11px ui-monospace, monospace; color: var(--stone); width: 18px; text-align: right; }
  .tile { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; flex: none; color: var(--ink); background: color-mix(in srgb, var(--c) 14%, var(--paper)); }
  .aitem .nm { flex: 1; min-width: 0; font-size: 14px; line-height: 1.3; }
  .aitem .nm b { display: block; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .aitem .nm small { display: block; font-size: 12px; color: var(--stone); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
  .aitem .badge { font-size: 11px; padding: 2px 8px; }
  .aitem .dirty { width: 6px; height: 6px; border-radius: 50%; background: var(--ink); }
  .sep { height: 1px; background: var(--line); margin: 6px 8px; }

  .editor { background: var(--paper); border-radius: 24px; box-shadow: var(--ring); padding: 32px; min-height: 400px; }
  .ehead { display: flex; align-items: center; gap: 16px; margin-bottom: 28px; }
  .ehead .tile { width: 56px; height: 56px; border-radius: 18px; }
  .ehead h2 { margin: 0; font-weight: 400; font-size: 32px; letter-spacing: -.03em; line-height: 1.1; }
  .ehead .file { font: 12px ui-monospace, monospace; color: var(--stone); margin-top: 4px; }
  .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .field { display: flex; flex-direction: column; gap: 8px; }
  .field.full { grid-column: 1 / -1; }
  .field > span { font-size: 13px; font-weight: 500; color: var(--charcoal); display: flex; justify-content: space-between; }
  .field > span small { font-weight: 400; color: var(--stone); }
  .field .input:disabled { color: var(--stone); background: var(--linen); }
  textarea.role { min-height: 260px; resize: vertical; font: 13.5px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; }
  .icons { display: grid; grid-template-columns: repeat(auto-fill, minmax(40px, 1fr)); gap: 6px; }
  .icons button { aspect-ratio: 1; border-radius: 12px; border: 1px solid var(--line); background: var(--paper); display: grid; place-items: center; color: var(--graphite); }
  .icons button:hover { border-color: var(--graphite); color: var(--ink); }
  .icons button.on { background: var(--espresso); color: #fff; border-color: var(--espresso); }
  .colors { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .colors button { width: 28px; height: 28px; border-radius: 999px; border: 0; background: var(--c); box-shadow: inset 0 0 0 1px rgba(0,0,0,.08); }
  .colors button.on { box-shadow: 0 0 0 2px var(--paper), 0 0 0 4px var(--ink); }
  .colors input[type=color] { width: 36px; height: 30px; border: 0; padding: 0; background: none; cursor: pointer; }
  .switch { display: flex; align-items: center; gap: 12px; cursor: pointer; font-size: 14px; color: var(--graphite); }
  .switch input { appearance: none; width: 40px; height: 24px; border-radius: 999px; background: var(--line-strong); position: relative; cursor: pointer; transition: background .2s; margin: 0; flex: none; }
  .switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: transform .2s; }
  .switch input:checked { background: var(--espresso); }
  .switch input:checked::after { transform: translateX(16px); }
  .actions { display: flex; gap: 8px; align-items: center; margin-top: 28px; padding-top: 20px; border-top: 1px solid var(--line); }
  .actions .status { font-size: 13px; color: var(--stone); margin-right: auto; display: inline-flex; gap: 6px; align-items: center; }
  .note { font-size: 13px; color: var(--stone); margin: 0 0 20px; display: flex; gap: 8px; }

  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; }
    .side { position: static; max-height: none; }
    .fields { grid-template-columns: 1fr; }
    .editor { padding: 20px; }
  }
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <a class="logo" href="/"><span class="mark"><i data-icon="logo" data-size="18"></i></span>Agents Atelier</a>
    <nav class="links">
      <a href="/projects"><i data-icon="grid" data-size="16"></i>Projects</a>
      <a href="/agents" class="on"><i data-icon="users" data-size="16"></i>Agents</a>
      <a href="/guide"><i data-icon="book" data-size="16"></i>Guide</a>
    </nav>
    <button class="btn btn-dark" data-new title="New project"><i data-icon="plus" data-size="16"></i>New project</button>
  </div>
</header>

<main class="wrap page">
  <h1 class="sr-only">Agents</h1>

  <div class="layout">
    <aside class="side">
      <div class="head"><span id="count"></span>
        <button class="btn btn-dark btn-sm" id="add"><i data-icon="plus" data-size="16"></i>New agent</button></div>
      <div class="alist" id="list"></div>
    </aside>
    <section class="editor" id="editor"></section>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const AGENT_ICONS = ["clipboard","compass","palette","type","code","image","brush","devices","zap","sparkles","accessibility","search",
  "gauge","bug","award","bot","eye","layers","message","pencil","file","folder","users","monitor","phone","clock","alert","check"];
const COLORS = ["#8b5cf6","#6366f1","#0ea5e9","#06b6d4","#14b8a6","#10b981","#84cc16","#eab308","#f59e0b","#f97316","#ef4444","#ec4899","#d946ef","#766a7c"];

let agents = [], current = null, draft = null, isNew = false, common = "";

// ================================================================ load
async function load(selectId) {
  try {
    [agents, { text: common }] = await Promise.all([api("/api/agents?full=1"), api("/api/agents/common")]);
  } catch (err) {
    $("list").innerHTML = "";
    $("count").textContent = "";
    return showError($("editor"), err, () => load(selectId), "Couldn't load the agents");
  }
  renderList();
  select(selectId ?? current ?? agents[0]?.id);
}

function renderList() {
  $("count").textContent = `${agents.length} agents · ${agents.filter(a => a.default).length} on by default`;
  $("list").innerHTML = `
    <button class="aitem ${current === "_common" ? "on" : ""}" data-id="_common">
      <span class="grip"></span><span class="num"></span>
      <span class="tile" style="--c:#766a7c">${icon("layers", { size: 16 })}</span>
      <span class="nm"><b>Shared rules</b><small>Given to every agent first</small></span><span class="badge">all</span></button>
    <div class="sep"></div>` +
    agents.map((a, i) => `
    <div class="aitem ${a.id === current ? "on" : ""}" data-id="${esc(a.id)}" draggable="true" role="button" tabindex="0">
      <span class="grip" title="Drag to reorder">${icon("menu", { size: 12 })}</span>
      <span class="num">${i + 1}</span>
      <span class="tile" style="--c:${a.color}">${icon(a.icon, { size: 16 })}</span>
      <span class="nm"><b>${esc(a.name)}</b><small>${esc(a.description || "No description")}</small></span>
      ${a.id === current && isDirty() ? `<span class="dirty" title="Unsaved changes"></span>` : ""}
      ${a.model ? `<span class="badge mono" title="Model">${esc(a.model)}</span>` : ""}${a.default ? "" : `<span class="badge">off</span>`}
    </div>`).join("") +
    (isNew ? `<div class="aitem on"><span class="grip"></span><span class="num">${agents.length + 1}</span>
      <span class="tile" style="--c:${draft.color}">${icon(draft.icon, { size: 16 })}</span><span class="nm"><b>${esc(draft.name || "New agent")}</b><small>${esc(draft.description || "Not saved yet")}</small></span>
      <span class="dirty"></span></div>` : "");
}

// ================================================================ select & edit
async function select(id) {
  if (id !== current && isDirty() &&
      !await confirmDialog({ title: "Discard changes?", text: "You have unsaved changes to this agent.", ok: "Discard", danger: true })) return;
  isNew = false;
  current = id;
  if (id === "_common") draft = { text: common };
  else { const a = agents.find(a => a.id === id); draft = a ? { ...a } : null; }
  renderList(); renderEditor();
  if (draft) dirtyChanged();
}

function original() {
  if (isNew) return { id: "", name: "", icon: "bot", color: "#766a7c", default: true, description: "", model: "", role: "" };
  if (current === "_common") return { text: common };
  return agents.find(a => a.id === current);
}
function isDirty() {
  if (!draft) return false;
  if (isNew) return true;
  const o = original(); if (!o) return false;
  return Object.keys(draft).some(k => draft[k] !== o[k]);
}

function renderEditor() {
  const ed = $("editor");
  if (!draft) { ed.innerHTML = `<p class="note">Pick an agent on the left.</p>`; return; }

  if (current === "_common" && !isNew) {
    ed.innerHTML = `
      <div class="ehead"><span class="tile" style="--c:#766a7c">${icon("layers", { size: 26 })}</span>
        <div><h2>Shared rules</h2><div class="file">agents/_common.md</div></div></div>
      <p class="note">${icon("alert", { size: 16 })}Given to every agent before its own role. Keep the file list and “plain HTML/CSS/JS” rules unless you change how projects work.</p>
      <label class="field full"><span>Instructions</span><textarea class="input role" id="f-text" spellcheck="false">${esc(draft.text)}</textarea></label>
      ${actionsBar(false)}`;
    $("f-text").addEventListener("input", (e) => { draft.text = e.target.value; dirtyChanged(); });
    return;
  }

  ed.innerHTML = `
    <div class="ehead"><span class="tile" id="preview-tile" style="--c:${draft.color}">${icon(draft.icon, { size: 26 })}</span>
      <div><h2 id="preview-name">${esc(draft.name || "New agent")}</h2>
      <div class="file">${isNew ? "will be saved as agents/" + String(agents.length + 1).padStart(2, "0") + "-&lt;id&gt;.md" : "agents/" + esc(draft.file)}</div></div></div>
    <div class="fields">
      <label class="field"><span>Name</span><input class="input" id="f-name" maxlength="40" value="${esc(draft.name)}" placeholder="e.g. Dark mode"></label>
      <label class="field"><span>Id <small>${isNew ? "lowercase, numbers, dashes" : "can’t be changed"}</small></span>
        <input class="input mono" id="f-id" value="${esc(draft.id)}" ${isNew ? "" : "disabled"} placeholder="dark-mode"></label>
      <div class="field"><span>Icon</span><div class="icons" id="f-icons">${AGENT_ICONS.map(n =>
        `<button type="button" data-icon-name="${n}" class="${n === draft.icon ? "on" : ""}" title="${n}">${icon(n, { size: 18 })}</button>`).join("")}</div></div>
      <div class="field"><span>Color <small>used as a small accent</small></span>
        <div class="colors" id="f-colors">${COLORS.map(c => `<button type="button" data-color="${c}" style="--c:${c}" class="${c === draft.color ? "on" : ""}" title="${c}"></button>`).join("")}
          <input type="color" id="f-color" value="${esc(draft.color)}" title="Custom color"></div>
        <label class="switch" style="margin-top:16px"><input type="checkbox" id="f-default" ${draft.default ? "checked" : ""}>
          <span>On by default for new projects</span></label></div>
      <label class="field full"><span>Model <small>which Claude model runs this agent — empty uses the server default (your Claude Code model, or AGENT_MODEL)</small></span>
        <input class="input mono" id="f-model" list="model-options" maxlength="64" value="${esc(draft.model || "")}" placeholder="default">
        <datalist id="model-options"><option value="sonnet">fast, cheaper — good for mechanical work</option><option value="opus">strongest — planning, review</option><option value="haiku">fastest, cheapest — tiny tasks</option></datalist></label>
      <label class="field full"><span>Description <small id="desc-count">${(draft.description || "").length}/160 · one line shown in the studio and guide</small></span>
        <input class="input" id="f-desc" maxlength="160" value="${esc(draft.description || "")}" placeholder="What this agent does, in one sentence"></label>
      <label class="field full"><span>Role prompt <small>the full instructions — the agent only sees the project files, the shared rules and this</small></span>
        <textarea class="input role" id="f-role" spellcheck="false" placeholder="You are the … agent. …">${esc(draft.role)}</textarea></label>
    </div>
    ${actionsBar(!isNew)}`;

  $("f-name").addEventListener("input", (e) => {
    draft.name = e.target.value;
    $("preview-name").textContent = draft.name || "New agent";
    if (isNew && !draft._idTouched) $("f-id").value = draft.id = slug(draft.name);
    dirtyChanged();
  });
  $("f-id")?.addEventListener("input", (e) => { draft.id = e.target.value; draft._idTouched = true; dirtyChanged(); });
  $("f-role").addEventListener("input", (e) => { draft.role = e.target.value; dirtyChanged(); });
  $("f-model").addEventListener("input", (e) => { draft.model = e.target.value.trim(); dirtyChanged(); });
  $("f-desc").addEventListener("input", (e) => {
    draft.description = e.target.value; $("desc-count").textContent = `${draft.description.length}/160 · one line shown in the studio and guide`; dirtyChanged();
  });
  $("f-default").addEventListener("change", (e) => { draft.default = e.target.checked; dirtyChanged(); });
  $("f-icons").addEventListener("click", (e) => {
    const b = e.target.closest("[data-icon-name]"); if (!b) return;
    draft.icon = b.dataset.iconName;
    [...$("f-icons").children].forEach(x => x.classList.toggle("on", x === b));
    $("preview-tile").innerHTML = icon(draft.icon, { size: 26 });
    dirtyChanged();
  });
  const setColor = (c) => {
    draft.color = c.toLowerCase();
    [...$("f-colors").querySelectorAll("button")].forEach(x => x.classList.toggle("on", x.dataset.color === draft.color));
    $("preview-tile").style.setProperty("--c", draft.color);
    dirtyChanged();
  };
  $("f-colors").addEventListener("click", (e) => { const b = e.target.closest("[data-color]"); if (b) { setColor(b.dataset.color); $("f-color").value = b.dataset.color; } });
  $("f-color").addEventListener("input", (e) => setColor(e.target.value));
}

function actionsBar(canDelete) {
  return `<div class="actions">
    <span class="status" id="status"></span>
    ${canDelete ? `<button class="btn btn-ghost" id="del">${icon("trash", { size: 16 })}Delete</button>` : ""}
    <button class="btn btn-ghost" id="revert">${isNew ? "Cancel" : "Revert"}</button>
    <button class="btn btn-dark" id="save">${icon("check", { size: 16 })}${isNew ? "Create agent" : "Save"}</button>
  </div>`;
}
function dirtyChanged() {
  const d = isDirty();
  $("status").innerHTML = d ? `${icon("pencil", { size: 14 })}Unsaved changes` : `${icon("check", { size: 14 })}Saved`;
  $("save").disabled = !d; $("revert").disabled = !d && !isNew;
  renderList();
}
const slug = (s) => s.toLowerCase().trim().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 32);

$("editor").addEventListener("click", async (e) => {
  if (e.target.closest("#save")) return save();
  if (e.target.closest("#revert")) {
    if (isNew) { isNew = false; draft = null; return select(agents[0]?.id); }
    draft = { ...original() }; return renderEditor(), dirtyChanged();
  }
  if (e.target.closest("#del")) {
    if (!await confirmDialog({ title: `Delete “${draft.name}”?`, text: `This removes agents/${draft.file}. Projects that had this agent switched on will simply skip it.`, ok: "Delete", danger: true })) return;
    try { await api(`/api/agents/${encodeURIComponent(current)}`, { method: "DELETE" }); toast("Agent deleted"); draft = null; current = null; load(); }
    catch (err) { toast(err.message, "err"); }
  }
});

async function save() {
  try {
    if (current === "_common" && !isNew) {
      common = (await api("/api/agents/common", { method: "PUT", body: JSON.stringify({ text: draft.text }) })).text;
      draft = { text: common }; toast("Shared rules saved");
    } else if (isNew) {
      const a = await api("/api/agents", { method: "POST", body: JSON.stringify(draft) });
      isNew = false; draft = null; toast(`${a.name} joined the team`); return load(a.id);
    } else {
      await api(`/api/agents/${encodeURIComponent(current)}`, { method: "PUT", body: JSON.stringify(draft) });
      toast("Agent saved"); draft = null; return load(current).then(() => select(current));
    }
    renderEditor(); dirtyChanged();
  } catch (err) { toast(err.message, "err"); }
}

$("add").onclick = async () => {
  if (isDirty() && !isNew && !await confirmDialog({ title: "Discard changes?", text: "You have unsaved changes to this agent.", ok: "Discard", danger: true })) return;
  isNew = true; current = null;
  draft = { id: "", name: "", icon: "bot", color: "#766a7c", default: true, description: "", model: "",
    role: "You are the … agent. <your mission in one sentence>\n\nRead: <which files and plan.md sections>.\n\nDo:\n- …\n- …\n\nDon't: <what to leave to other agents>." };
  renderList(); renderEditor(); dirtyChanged(); $("f-name").focus();
};

// ================================================================ list: click + drag to reorder
$("list").addEventListener("click", (e) => { const it = e.target.closest(".aitem[data-id]"); if (it) select(it.dataset.id); });
$("list").addEventListener("keydown", (e) => {
  const it = e.target.closest(".aitem[data-id]"); if (!it) return;
  if (e.key === "Enter" || e.key === " ") { e.preventDefault(); select(it.dataset.id); }
  if (e.altKey && (e.key === "ArrowUp" || e.key === "ArrowDown")) { e.preventDefault(); move(it.dataset.id, e.key === "ArrowUp" ? -1 : 1); }
});

let dragId = null;
$("list").addEventListener("dragstart", (e) => {
  const it = e.target.closest(".aitem[draggable]"); if (!it) return;
  dragId = it.dataset.id; it.classList.add("dragging"); e.dataTransfer.effectAllowed = "move";
});
$("list").addEventListener("dragover", (e) => {
  const it = e.target.closest(".aitem[draggable]"); if (!it || !dragId) return;
  e.preventDefault();
  document.querySelectorAll(".drop-before,.drop-after").forEach(x => x.classList.remove("drop-before", "drop-after"));
  const r = it.getBoundingClientRect();
  it.classList.add(e.clientY < r.top + r.height / 2 ? "drop-before" : "drop-after");
});
$("list").addEventListener("dragend", () => { dragId = null; document.querySelectorAll(".dragging,.drop-before,.drop-after").forEach(x => x.classList.remove("dragging", "drop-before", "drop-after")); });
$("list").addEventListener("drop", async (e) => {
  const it = e.target.closest(".aitem[draggable]"); if (!it || !dragId) return;
  e.preventDefault();
  const ids = agents.map(a => a.id).filter(id => id !== dragId);
  let at = ids.indexOf(it.dataset.id);
  if (it.classList.contains("drop-after")) at++;
  if (it.dataset.id === dragId) return;
  ids.splice(at, 0, dragId);
  await saveOrder(ids);
});
async function move(id, dir) {
  const ids = agents.map(a => a.id), i = ids.indexOf(id), j = i + dir;
  if (j < 0 || j >= ids.length) return;
  [ids[i], ids[j]] = [ids[j], ids[i]];
  await saveOrder(ids);
  document.querySelector(`.aitem[data-id="${CSS.escape(id)}"]`)?.focus();
}
async function saveOrder(ids) {
  try {
    const fresh = await api("/api/agents/order", { method: "POST", body: JSON.stringify({ ids }) });
    agents = fresh;
    if (draft && !isNew && current !== "_common") draft.file = agents.find(a => a.id === current)?.file;
    renderList(); if (!isDirty()) renderEditor(), dirtyChanged();
    toast("Order saved");
  } catch (err) { toast(err.message, "err"); }
}

window.addEventListener("beforeunload", (e) => { if (isDirty()) { e.preventDefault(); e.returnValue = ""; } });
window.addEventListener("scroll", () => document.querySelector("header.top").classList.toggle("scrolled", scrollY > 4));

document.addEventListener("click", (e) => { if (e.target.closest("[data-new]")) newProject(); });
const want = new URLSearchParams(location.search).get("agent");
load(want || undefined);
</script>
</body>
</html>
