<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/static/logo.svg" type="image/svg+xml">
<meta name="theme-color" content="#0f1117">
<title>Users · Agents Atelier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/static/base.css">
<link rel="stylesheet" href="/static/site.css">
<script src="/static/i18n.js"></script>
<script src="/static/icons.js"></script>
<script src="/static/ui.js"></script>
<style>
  .table-wrap { margin-top: 20px; overflow-x: auto; background: var(--paper); border: 1px solid var(--line-strong); border-radius: var(--r); }
  .utable { width: 100%; min-width: 860px; border-collapse: collapse; font-size: 14px; }
  .utable th { padding: 12px 14px; text-align: start; font-size: 12px; font-weight: 500; letter-spacing: .04em; color: var(--graphite); background: var(--mist); border-bottom: 1px solid var(--line-strong); white-space: nowrap; }
  .utable td { padding: 10px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; overflow-wrap: anywhere; }
  .utable tbody tr:last-child td { border-bottom: 0; }
  .utable tbody tr:hover td { background: var(--ice); }
  .utable .who b { font-weight: 500; }
  .utable .muted { color: var(--stone); white-space: nowrap; }
  .utable select { height: 36px; min-width: 150px; padding: 0 10px; font-size: 13px; }
  #pager { margin-top: 12px; }
</style>
<link rel="stylesheet" href="/static/theme.css">
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="logo" href="/"><span class="mark"><i data-icon="logo" data-size="18"></i></span>Agents Atelier</a>
    <nav class="links">
      <a href="/projects"><i data-icon="grid" data-size="16"></i>Projects</a>
      <a href="/agents"><i data-icon="users" data-size="16"></i>My agents</a>
      <a href="/teams"><i data-icon="layers" data-size="16"></i>My teams</a>
    </nav>
    <a class="btn btn-dark" href="/projects/new"><i data-icon="plus" data-size="16"></i>New project</a>
  </div>
</header>
<main class="wrap page">
  <h1 class="page-title">Users</h1>
  <p class="lead" id="summary">Admins can change the shared agents, teams and rules, and open every project.</p>
  <div id="list"><p>Loading…</p></div>
  <nav class="pager" id="pager" aria-label="Pages of users"></nav>
</main>
<script>
document.addEventListener("click", (e) => { if (e.target.closest("[data-new]")) newProject(); });
const list = document.getElementById("list");
const LABEL = { admin: "Admin", user: "User", unconfirmed: "Not confirmed" };
const PLAN = { starter: "Starter", pro: "Pro", agency: "Agency" };
let users = [], me = null, page = 1, perPage = perPagePref("users", 10);
const cell = (v) => (v ? esc(v) : `<span class="muted">-</span>`);
function draw() {
  const pg = paginate(users, page, perPage);
  page = pg.page;
  list.innerHTML = `<div class="table-wrap"><table class="utable">
    <thead><tr><th scope="col">Name</th><th scope="col">Email</th><th scope="col">Company</th><th scope="col">Occupation</th><th scope="col">Builds for</th><th scope="col">Heard from</th><th scope="col">Joined</th><th scope="col">Claude key</th><th scope="col">Plan</th><th scope="col">Role</th></tr></thead>
    <tbody>${pg.items.map(u => `<tr>
      <td class="who"><b data-no-i18n>${esc(u.name || "-")}</b>${u.id === me.id ? ` <span class="badge">you</span>` : ""}</td>
      <td class="em" data-no-i18n>${esc(u.email)}</td>
      <td data-no-i18n>${cell(u.company)}</td>
      <td class="opt">${cell(u.job_role)}</td><td class="opt">${cell(u.use_case)}</td><td class="opt">${cell(u.referral)}</td>
      <td class="muted opt">${ago(u.created)}</td>
      <td class="key"><span class="cl">Claude key</span>${u.claude_key?.set ? `<span class="badge listed" title="Runs on their own Claude account">${icon("check", { size: 12 })}Added</span>` : `<span class="muted">None</span>`}</td>
      <td class="pl"><span class="cl">Plan</span>${u.role === "admin" ? `<span class="muted">Every feature</span>` : `<select class="input" data-plan="${esc(u.id)}" aria-label="Plan of ${esc(u.email)}">
        ${Object.keys(PLAN).map(r => `<option value="${r}" ${r === u.plan ? "selected" : ""}>${PLAN[r]}</option>`).join("")}
      </select>${u.plan_request ? `<div class="ask"><span class="badge req">${icon("clock", { size: 12 })}Asks for ${esc(PLAN[u.plan_request] || u.plan_request)}${u.plan_request_period === "yearly" ? " · yearly" : " · monthly"}${u.plan_request_at ? ` · ${esc(ago(u.plan_request_at))}` : ""}</span>
        <span class="ask-acts"><button class="btn btn-dark btn-sm" type="button" data-approve="${esc(u.id)}" data-to="${esc(u.plan_request)}">Approve</button>
        <button class="btn btn-ghost btn-sm" type="button" data-decline="${esc(u.id)}">Decline</button></span></div>` : ""}`}</td>
      <td class="rl"><span class="cl">Role</span><select class="input" data-id="${esc(u.id)}" aria-label="Role of ${esc(u.email)}" ${u.id === me.id ? 'disabled title="You can\'t change your own role"' : ""}>
        ${Object.keys(LABEL).map(r => `<option value="${r}" ${r === u.role ? "selected" : ""}>${LABEL[r]}</option>`).join("")}
      </select></td></tr>`).join("")}</tbody></table></div>`;
  $pager.innerHTML = pagerHTML(pg, { noun: "users" });
}
const $pager = document.getElementById("pager");
async function load() {
  try { [users, me] = await Promise.all([api("/api/users"), getMe()]); }
  catch (err) { return showError(list, err, load, "Couldn't load the users"); }
  users.sort((a, b) => (b.plan_request ? 1 : 0) - (a.plan_request ? 1 : 0));   // plan requests first
  const asks = users.filter(u => u.plan_request).length;
  const waiting = users.filter(u => u.role === "unconfirmed").length;
  document.getElementById("summary").textContent = `${users.length} account${users.length === 1 ? "" : "s"}${waiting ? `, ${waiting} not confirmed yet` : ""}${asks ? `, ${asks} plan request${asks === 1 ? "" : "s"} waiting` : ""}. Admins can change the shared agents, teams and rules, and open every project.`;
  draw();
}
bindPager($pager, (p) => { page = p; draw(); list.scrollIntoView({ block: "nearest", behavior: "smooth" }); },
  (n) => { perPage = n; savePerPage("users", n); page = 1; draw(); });
list.addEventListener("click", (e) => {
  const ok = e.target.closest("[data-approve]"), no = e.target.closest("[data-decline]");
  if (!ok && !no) return;
  const body = ok ? { plan: ok.dataset.to } : { decline_request: true };
  ok?.parentElement.querySelectorAll("button").forEach(x => { if (x !== ok) x.disabled = true; });
  no?.parentElement.querySelectorAll("button").forEach(x => { if (x !== no) x.disabled = true; });
  withBusy(ok || no, async () => {
    const u = await api(`/api/users/${(ok || no).dataset[ok ? "approve" : "decline"]}`, { method: "PATCH", body: JSON.stringify(body) });
    Object.assign(users.find(x => x.id === u.id), u); draw();
    toast(ok ? `${u.email} is now on ${PLAN[u.plan]}` : "Request declined");
  }, { onError: (err) => { toast(err.message, "err"); (ok || no).parentElement.querySelectorAll("button").forEach(x => { x.disabled = false; }); } });
});
/* A plan or role change: the select is locked while it saves, and goes back to the saved value if it fails. */
list.addEventListener("change", (e) => {
  const sel = e.target.closest("select[data-plan], select[data-id]");
  if (!sel) return;
  const isPlan = sel.matches("[data-plan]"), id = isPlan ? sel.dataset.plan : sel.dataset.id;
  const body = isPlan ? { plan: sel.value } : { role: sel.value };
  withBusy(sel, async () => {
    const u = await api(`/api/users/${id}`, { method: "PATCH", body: JSON.stringify(body) });
    Object.assign(users.find(x => x.id === u.id), u);
    toast(isPlan ? `${u.email} is now on ${PLAN[u.plan]}` : `${u.email} is now: ${LABEL[u.role]}`);
  }, { onError: (err) => {
    const u = users.find(x => x.id === id);
    if (u) sel.value = isPlan ? u.plan : u.role;      // nothing changed on the server
    toast(err.message, "err");
  } });
});
load().catch(err => showError(list, err, () => location.reload(), "Something went wrong on this page"));   // a bug must not leave "Loading…" forever
</script>
<style>
  .utable .ask { display: grid; gap: 6px; margin-top: 8px; }
  .utable .ask .badge.req { display: inline-flex; align-items: center; gap: 4px; background: var(--ice); color: var(--sky); justify-self: start; }
  .utable .ask-acts { display: flex; gap: 6px; }
  .utable .cl { display: none; }
  @media (max-width: 760px) {
    .utable thead { display: none; }
    .utable, .utable tbody { display: block; min-width: 0; }
    .utable tr { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px 12px; padding: 14px; border-bottom: 1px solid var(--line); }
    .utable td { display: block; padding: 0; border: 0; min-width: 0; }
    .utable td.who, .utable td.em { grid-column: 1 / -1; }
    .utable td.em { margin-top: -8px; color: var(--stone); overflow-wrap: anywhere; }
    .utable td.opt { display: none; }
    .utable td:nth-child(3) { display: none; }
    .utable td.rl { grid-column: 1 / -1; }
    .utable .cl { display: block; font-size: 12px; color: var(--stone); margin-bottom: 4px; }
    .utable select.input { width: 100%; }
  }
</style>
</body>
</html>
