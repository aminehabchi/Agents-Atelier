<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/static/logo.svg" type="image/svg+xml">
<meta name="theme-color" content="#0f1117">
<title>Profile · Agents Atelier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/static/base.css">
<link rel="stylesheet" href="/static/site.css">
<script src="/static/i18n.js"></script>
<script src="/static/icons.js"></script>
<script src="/static/ui.js"></script>
<style>
  html { scroll-behavior: smooth; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }

  /* who you are, across the top */
  .hero { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; background: var(--paper); border: 1px solid var(--line-strong); border-radius: var(--r); box-shadow: var(--hard); padding: 24px; margin: 8px 0 32px; }
  .hero-avatar { flex: none; width: 72px; height: 72px; display: grid; place-items: center; background: var(--canary); color: var(--on-accent); border: 1px solid var(--line-strong); border-radius: var(--r); font-weight: 600; font-size: 24px; }
  .hero-who { flex: 1 1 240px; min-width: 0; overflow-wrap: anywhere; }
  .hero-who h1 { margin: 0; font-weight: 500; font-size: 24px; line-height: 1.2; }
  .hero-who p { margin: 4px 0 8px; color: var(--graphite); font-size: 14px; }
  .hero-who small { color: var(--stone); font-size: 13px; margin-left: 8px; }

  /* the sections, with a contents list that follows you */
  .layout { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 32px; align-items: start; }
  .toc { position: sticky; top: 92px; display: flex; flex-direction: column; gap: 2px; }
  .toc a { display: flex; align-items: center; gap: 10px; padding: 9px 12px; font-size: 13px; text-decoration: none; color: var(--graphite); border-radius: var(--r); border: 1.5px solid transparent; }
  .toc a:hover { background: var(--ice); color: var(--ink); }
  .toc a.on { background: var(--paper); border-color: var(--line-strong); color: var(--ink); font-weight: 500; }
  .toc a.danger:hover, .toc a.danger.on { color: var(--danger); }

  .sect { scroll-margin-top: 92px; background: var(--paper); border: 1px solid var(--line-strong); border-radius: var(--r); padding: 24px; margin-bottom: 16px; }
  .sect h2 { margin: 0 0 4px; font-size: 16px; font-weight: 500; }
  .sect > p { margin: 0 0 20px; color: var(--graphite); font-size: 14px; line-height: 1.55; }
  .pf { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; min-width: 0; }
  .pf label, .pref-label { font-size: 13px; font-weight: 500; display: flex; justify-content: space-between; gap: 12px; }
  .pf em { font-style: normal; font-weight: 400; color: var(--stone); font-size: 12px; }
  .pf em.met { color: var(--ok); }
  .pf .input { width: 100%; }
  .pf .input[readonly] { background: var(--mist); color: var(--graphite); }
  .pf select.input { height: 46px; font-size: 15px; }
  .pf small.help { color: var(--stone); font-size: 12px; line-height: 1.4; }
  .two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 16px; }
  .pw { position: relative; }
  .pw .input { padding-right: 46px; }
  .pw button { position: absolute; top: 0; right: 0; bottom: 0; width: 44px; display: grid; place-items: center; background: none; border: 0; color: var(--stone); }
  .pw button:hover, .pw button[aria-pressed="true"] { color: var(--ink); }
  .form-end { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 4px; }
  .perr { color: var(--danger); font-size: 13px; line-height: 1.5; margin: 0 0 12px; }
  .perr:empty { display: none; }
  .key-steps { margin: 0 0 16px; padding-inline-start: 20px; display: grid; gap: 6px; font-size: 14px; line-height: 1.55; color: var(--graphite); }
  .key-on { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 14px 16px; border-radius: var(--r); background: var(--mist); }
  .key-ic { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--add-bg, var(--ice)); color: var(--ok); flex: none; }
  .key-txt { flex: 1 1 200px; min-width: 0; display: grid; gap: 2px; }
  .key-txt b { font: 500 14px var(--mono, monospace); }
  .key-txt small { font-size: 12px; color: var(--stone); }
  .plan-now { display: flex; flex-wrap: wrap; gap: 16px 24px; align-items: center; padding: 18px 20px; border-radius: var(--r); background: var(--mist); margin-bottom: 16px; }
  .pn-name { display: grid; gap: 2px; min-width: 140px; }
  .pn-label { font-size: 12px; color: var(--stone); text-transform: uppercase; letter-spacing: .04em; }
  .pn-name b { font-size: 22px; font-weight: 500; }
  .pn-price { font-size: 13px; color: var(--graphite); }
  .pn-stats { display: flex; flex-wrap: wrap; gap: 12px; margin-inline-start: auto; }
  .pn-stat { min-width: 120px; padding: 10px 14px; border-radius: var(--r); background: var(--paper); border: 1px solid var(--line); display: grid; gap: 2px; align-content: start; }
  .pn-stat b { font-size: 16px; font-weight: 500; font-variant-numeric: tabular-nums; }
  .pn-stat span { font-size: 12px; color: var(--stone); }
  .pn-stat a { font-size: 12px; }
  .meter { display: block; height: 4px; border-radius: 4px; background: var(--line); overflow: hidden; margin-top: 4px; }
  .meter i { display: block; height: 100%; background: var(--sky); border-radius: 4px; }
  .meter i.full { background: var(--danger); }
  .pn-request { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 14px 16px; border-radius: var(--r); border: 1px solid var(--line-strong); background: var(--paper); margin-bottom: 16px; }
  .pn-request > svg { color: var(--sky); flex: none; }
  .pn-request > div { flex: 1 1 240px; display: grid; gap: 2px; font-size: 13px; color: var(--graphite); }
  .pn-request b { color: var(--ink); font-weight: 500; font-size: 14px; }
  .plans { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(210px, 100%), 1fr)); margin-bottom: 12px; align-items: stretch; }
  .plan { border: 1px solid var(--line-strong); border-radius: var(--r); padding: 18px; display: flex; flex-direction: column; gap: 12px; scroll-margin-top: 120px; transition: box-shadow .3s; }
  .plan.on { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
  .plan.want { box-shadow: 0 0 0 3px var(--sky); border-color: var(--sky); }
  .plan header { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .plan header h3 { margin: 0; font-size: 15px; font-weight: 500; margin-inline-end: auto; }
  .plan .badge.pop { background: var(--ice); color: var(--sky); }
  .plan .badge.req { background: var(--linen, var(--mist)); color: var(--graphite); }
  .plan .price b { font-size: 26px; font-weight: 500; }
  .plan .price span { font-size: 13px; color: var(--stone); margin-inline-start: 4px; }
  .plan .price .billed { display: block; margin-top: 4px; font-size: 12px; color: var(--ok); }
  .period { display: inline-flex; gap: 2px; padding: 3px; margin: 0 0 14px; border-radius: var(--r); background: var(--linen, var(--mist)); }
  .period button { border: 0; background: none; font: inherit; font-size: 13px; padding: 7px 14px; border-radius: var(--r); color: var(--graphite); cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
  .period button[aria-checked="true"] { background: var(--paper); color: var(--ink); box-shadow: var(--ring); }
  .period .save { font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: var(--r-pill); background: var(--add-bg); color: var(--add-fg); }
  .plan ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 13px; line-height: 1.45; flex: 1; align-content: start; }
  .plan li { display: grid; grid-template-columns: 14px 1fr; gap: 8px; align-items: start; color: var(--graphite); }
  .plan li svg { margin-top: 3px; color: var(--ok); }
  .plan li.no { color: var(--stone); }
  .plan li.no svg { color: var(--stone); }
  .plan .btn { justify-content: center; }
  .plan-act { display: grid; gap: 8px; }
  .plan-how { display: flex; align-items: center; justify-content: center; gap: 6px; margin: 0; font-size: 12px; line-height: 1.4; color: var(--stone); text-align: center; }
  .plan-how svg { flex: none; }
  .plan-how.paid { color: var(--ok); }
  .pn-paid { display: inline-flex; align-items: center; gap: 6px; margin-top: 6px; padding: 3px 10px; border-radius: var(--r-pill, 999px); font-size: 12px; width: fit-content;
    background: rgb(var(--zellige-rgb) / .14); color: var(--ok); }
  .plan-ai { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: var(--r); background: var(--ice); margin-bottom: 16px; font-size: 13px; line-height: 1.55; color: var(--graphite); }
  .plan-ai > svg { flex: none; margin-top: 2px; color: var(--sky); }
  .plan-ai b { display: block; color: var(--ink); font-weight: 500; font-size: 14px; margin-bottom: 2px; }
  .plan-ai a { white-space: nowrap; }
  .plan-note { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; line-height: 1.5; color: var(--stone); margin: 4px 0 0; }
  .plan-note svg { flex: none; margin-top: 3px; }
  .plan .btn[disabled] { opacity: 1; color: var(--stone); }
  .plan-act .btn.busy { opacity: .7; cursor: progress; }

  /* while the profile loads */
  .sk { display: block; border-radius: var(--r); background: linear-gradient(90deg, var(--bone), var(--steel), var(--bone)); background-size: 200% 100%; animation: sk 1.2s linear infinite; }
  @keyframes sk { to { background-position: -200% 0; } }
  @media (prefers-reduced-motion: reduce) { .sk { animation: none; } .plan { transition: none; } }
  .sk-hero { display: flex; gap: 20px; align-items: center; background: var(--paper); border: 1px solid var(--line-strong); border-radius: var(--r); padding: 24px; margin: 8px 0 32px; }
  .sk-lines { flex: 1; display: grid; gap: 10px; }
  .limit { margin: 0; }
  .limit-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .limit-row .input { width: 120px; }
  .limit-row .cur { color: var(--stone); }
  .saved { font-size: 13px; color: var(--ok); display: inline-flex; align-items: center; gap: 6px; }
  .saved:empty { display: none; }

  .prefs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px 24px; }
  .pref-label { margin-bottom: 8px; }
  .prefs .seg { display: flex; box-shadow: var(--ring); }
  .prefs .seg button { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 6px; white-space: nowrap; }

  .hero-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .linked { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 14px; }
  .hchip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: var(--r-pill, 999px); font-size: 12px; text-decoration: none;
    background: var(--mist); color: var(--graphite); border: 1px solid var(--line); }
  a.hchip:hover { border-color: var(--line-strong); color: var(--ink); }
  .hchip.is-plan { background: var(--ice); color: var(--sky); border-color: transparent; }
  .hchip.ok { color: var(--ok); }
  .hchip.warn { color: var(--danger); border-color: var(--danger); }
  .hchip.quiet { background: transparent; border-color: transparent; padding-inline: 2px; color: var(--stone); }
  .toc a { position: relative; }
  .toc a .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--danger); margin-inline-start: auto; flex: none; }
  .grp-head { margin: 0 0 16px; }
  .grp-head h2 { margin: 0; font-size: 22px; font-weight: 500; }
  .grp-head p { margin: 4px 0 0; color: var(--graphite); font-size: 14px; }
  .grp[hidden] { display: none; }
  .del-facts { list-style: none; margin: -8px 0 20px; padding: 0; display: grid; gap: 8px; font-size: 13px; color: var(--graphite); }
  .del-facts li { display: flex; gap: 8px; align-items: flex-start; }
  .del-facts svg { flex: none; margin-top: 3px; color: var(--stone); }
  .danger-zone { border-color: var(--danger); }
  .danger-zone h2 { color: var(--danger); }
  dialog.modal .pf { text-align: start; }

  @media (max-width: 900px) {
    .layout { grid-template-columns: minmax(0, 1fr); gap: 16px; }
    .toc { position: sticky; top: 68px; z-index: 5; flex-direction: row; overflow-x: auto; background: var(--linen); padding: 8px 0; margin: 0 -16px; padding-inline: 16px; scrollbar-width: none; }
    .toc a { flex: none; padding: 7px 10px; }
    .sect { scroll-margin-top: 140px; }
  }
  @media (max-width: 560px) {
    .two, .prefs { grid-template-columns: minmax(0, 1fr); }
    .hero { padding: 20px 16px; box-shadow: var(--hard-sm); gap: 14px; }
    .hero-avatar { width: 56px; height: 56px; font-size: 20px; }
    .hero-who { flex-basis: 0; }
    .hero-who h1 { font-size: 21px; }
    .sect { padding: 20px 16px; }
    .plan-now { padding: 16px; }
    .pn-stats { margin-inline-start: 0; width: 100%; }
    .pn-stat { flex: 1 1 120px; }
    .plan-ai { padding: 12px 14px; }
  }
</style>
<link rel="stylesheet" href="/static/theme.css">
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="logo" href="/"><span class="mark"><i data-icon="logo" data-size="18"></i></span>Agents Atelier</a>
    <nav class="links">
      <a href="/projects"><i data-icon="grid" data-size="16"></i>Projects</a>
      <a href="/agents"><i data-icon="users" data-size="16"></i>My agents</a>
      <a href="/teams"><i data-icon="layers" data-size="16"></i>My teams</a>
    </nav>
    <a class="btn btn-dark" href="/projects/new"><i data-icon="plus" data-size="16"></i>New project</a>
  </div>
</header>
<main class="wrap page">
  <div id="app" aria-busy="true"><p class="sr-only" role="status">Loading…</p>
    <div class="sk-hero" aria-hidden="true"><span class="sk" style="width:72px;height:72px"></span>
      <span class="sk-lines"><span class="sk" style="width:220px;max-width:70%;height:22px"></span><span class="sk" style="width:160px;max-width:50%;height:14px"></span></span></div>
    <div class="layout" aria-hidden="true"><span class="sk" style="height:160px"></span><span class="sk" style="height:320px"></span></div></div>
</main>
<script>
document.addEventListener("click", (e) => { if (e.target.closest("[data-new]")) newProject(); });
const app = document.getElementById("app");
const $ = (id) => document.getElementById(id);
const ROLE = { admin: "Admin", user: "User" };
const MIN_PASSWORD = 8;
const send = (path, method, body) => api(path, { method, body: JSON.stringify(body || {}) });
const DETAILS = ["name", "company", "job_role", "use_case", "referral"];

const choice = (id, label, answers = [], value = "") => `
  <div class="pf"><label for="${id}"><span>${label}</span></label>
    <select class="input" id="${id}"><option value="">Not answered</option>
      ${answers.map(a => `<option value="${esc(a)}" ${a === value ? "selected" : ""}>${esc(a)}</option>`).join("")}</select></div>`;
const password = (id, label, ac, hint = "") => `
  <div class="pf"><label for="${id}"><span>${label}</span>${hint ? `<em id="${id}-hint">${hint}</em>` : ""}</label>
    <div class="pw"><input class="input" id="${id}" type="password" autocomplete="${ac}" maxlength="200">
      <button type="button" data-peek="${id}" aria-label="Show password" aria-pressed="false" title="Show password">${icon("eye", { size: 17 })}</button></div></div>`;
const seg = (attr, label, id, current, items) => `
  <div><span class="pref-label" id="${id}">${label}</span>
    <div class="seg" role="radiogroup" aria-labelledby="${id}">${items.map(([k, text, ic, raw]) =>
      `<button type="button" role="radio" ${raw ? "data-no-i18n" : ""} data-${attr}="${k}" aria-checked="${current === k}" class="${current === k ? "on" : ""}">${ic ? icon(ic, { size: 14 }) : ""}<span>${text}</span></button>`).join("")}</div></div>`;

function wirePeek(root) {
  root.querySelectorAll("[data-peek]").forEach(b => { b.onclick = () => {
    const input = $(b.dataset.peek), show = input.type === "password";
    input.type = show ? "text" : "password";
    b.setAttribute("aria-pressed", show);
    b.title = show ? "Hide password" : "Show password";
    b.setAttribute("aria-label", b.title);
  }; });
}

/* ---------- the member's own Claude API key: checked with one tiny call, kept encrypted, never shown again ---------- */
let me, planInfo;
function paintKey() {
  const box = $("key-box"); if (!box) return;
  const k = me.claude_key || {};
  box.innerHTML = k.set ? `
    <div class="key-on">
      <span class="key-ic">${icon("check", { size: 16 })}</span>
      <div class="key-txt"><b data-no-i18n>${esc(k.hint)}</b><small>Working${k.checked ? ` · checked ${esc(ago(k.checked))}` : ""}. Your projects run on this key.</small></div>
      <button class="btn btn-ghost btn-sm" type="button" id="key-replace">${icon("refresh", { size: 14 })}Replace</button>
      <button class="btn btn-ghost btn-sm" type="button" id="key-remove">${icon("trash", { size: 14 })}Remove</button>
    </div>` : keyForm();
  wireKey();
}
const keyForm = (replacing = false) => `
  <ol class="key-steps">
    <li>Open <a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener">console.anthropic.com</a>, add a little credit, and create an API key.</li>
    <li>Paste it here. The server checks it with one tiny call (well under a cent) and keeps it encrypted. Only its last four characters are ever shown.</li>
  </ol>
  <form id="key-form" novalidate>
    <div class="pf"><label for="key-input"><span>API key</span><em>starts with sk-ant-</em></label>
      <input class="input mono" id="key-input" type="password" autocomplete="off" spellcheck="false" placeholder="sk-ant-…" data-no-i18n></div>
    <p class="perr" id="key-err" role="alert"></p>
    <div class="form-end"><button class="btn btn-dark" id="key-go">${icon("check", { size: 15 })}Check and save</button>
      ${replacing ? `<button class="btn btn-ghost" type="button" id="key-cancel">Cancel</button>` : ""}
      <span class="saved" id="key-saved" role="status"></span></div>
  </form>`;
function wireKey() {
  $("key-replace")?.addEventListener("click", () => { $("key-box").innerHTML = keyForm(true); wireKey(); $("key-input").focus(); });
  $("key-cancel")?.addEventListener("click", paintKey);
  $("key-remove")?.addEventListener("click", async () => {
    if (!await confirmDialog({ title: "Remove your API key?", ok: "Remove", danger: true,
      text: "The agents can't work until you add a key again. Your projects stay as they are." })) return;
    await withBusy($("key-remove"), async () => { me = (await api("/api/auth/claude-key", { method: "DELETE" })).user; paintKey(); paintPlan(); toast("API key removed"); });
  });
  const form = $("key-form"); if (!form) return;
  form.onsubmit = async (e) => {
    e.preventDefault();
    const key = $("key-input").value.trim();
    $("key-err").textContent = "";
    if (!key.startsWith("sk-ant-")) { $("key-err").textContent = "A Claude API key starts with sk-ant-."; return $("key-input").focus(); }
    $("key-go").disabled = true; $("key-saved").textContent = "Checking with Claude…";
    try {
      me = (await send("/api/auth/claude-key", "PUT", { key })).user;
      paintKey(); paintPlan(); $("toc").querySelector(".dot")?.remove(); toast("API key saved: your agents are ready");
    } catch (err) { $("key-err").textContent = err.message; $("key-saved").textContent = ""; $("key-go").disabled = false; $("key-input").focus(); }
  };
}

const DELETE_DAYS = 30;
/* the header: your plan and your key at a glance, each a shortcut to its page */
function paintChips() {
  const box = $("hero-chips"); if (!box) return;
  const plan = planInfo.plans.find(p => p.id === me.plan);
  const chip = (href, ic, text, cls = "") => `<a class="hchip ${cls}" href="${href}">${icon(ic, { size: 13 })}<span>${text}</span></a>`;
  box.innerHTML = [
    me.role === "admin" ? chip("/users", "users", "Admin") : chip("#plan", "sparkles", `${esc(plan?.name || "Starter")} plan`, "is-plan"),
    planInfo.keys === "user" ? (me.claude_key?.set ? chip("#claude-key", "check", "Claude key added", "ok") : chip("#claude-key", "alert", "Add your Claude API key", "warn")) : "",
    `<span class="hchip quiet">${icon("clock", { size: 13 })}<span>Joined ${esc(ago(me.created))}</span></span>`,
  ].join("");
}

/* ---------- plan: what it includes, and the spending limit per run ---------- */
const PLAN_FEATURES = (p) => [
  [p.projects == null ? "Unlimited projects" : p.projects === 1 ? "One project" : `Up to ${p.projects} projects`, true],
  ["Official agents and ready teams", true],
  ["Read every agent's instructions, export agents and teams", p.instructions],
  ["Your own agents and teams", p.custom_agents],
  ["Web research agent", p.research],
  [p.browser_checks === "all" ? "Browser checks before Responsive, Accessibility, QA and the Critic" : "Browser check before the Critic", true],
  [p.versions == null ? "Every version kept" : `Last ${p.versions} versions kept`, true],
  ["Publish to the marketplace", p.publish],
  ["Invite editors and viewers to your projects", p.members],
  ...(planInfo?.keys === "user" ? [[p.run_limit === p.run_limit_max ? `Spending limit fixed at $${p.run_limit} per run` : `Your own spending limit, up to $${p.run_limit_max} per run`, true]] : []),
  [p.credit ? "Downloads carry a small “Made with Agents Atelier” line" : "Downloads without the credit line", !p.credit],
];
const RANK = { starter: 0, pro: 1, agency: 2 };
let billPeriod = "yearly";       // the plans show yearly prices first when the server offers them (paintPlan)
document.addEventListener("click", (e) => {
  const b = e.target.closest("#plan-box [data-period]"); if (!b) return;
  billPeriod = b.dataset.period; paintPlan();
  document.querySelector(`#plan-box [data-period="${billPeriod}"]`)?.focus();
});
function paintPlan() {
  const box = $("plan-box"); if (!box) return;
  const isAdmin = me.role === "admin", byKey = planInfo.keys === "user";
  const cur = planInfo.plans.find(p => p.id === me.plan) || planInfo.plans[0];

function planChange(from, to) {
  const have = new Map(PLAN_FEATURES(from)), get = PLAN_FEATURES(to);
  const lose = PLAN_FEATURES(from).filter(([text, ok]) => ok && !new Map(get).get(text)).map(([text]) => text);
  return { gain: get.filter(([text, ok]) => ok && !have.get(text)).map(([text]) => text), lose };
}

      const { user } = await send("/api/auth/me", "PATCH", body);
      savedDetails = JSON.stringify(detailValues());
      $("hero-name").textContent = user.name;
      $("hero-avatar").textContent = initialsOf(user);
      updateAccountButton(user);
      $("details-saved").textContent = "Saved";
    } catch (err) { $("details-err").textContent = err.message; refreshDetails(); }
  };

  /* accounts linked with Google or GitHub (oauth.py) */
  api("/api/auth/identities").then(list => {
    if (!list.length || !$("linked")) return;
    $("linked").innerHTML = list.map(i => `<span class="hchip ok">${icon("check", { size: 13 })}Linked with ${esc(i.name)}<span data-no-i18n>· ${esc(i.email)}</span></span>`).join(" ");
    $("linked").hidden = false;
  }).catch(() => {});

  /* password */
  const paintOthers = (n) => {
    $("others-text").textContent = n ? `You're also logged in on ${n} other device${n === 1 ? "" : "s"} or browser${n === 1 ? "" : "s"}.` : "You're not logged in anywhere else.";
    $("others-go").disabled = !n;
  };
  paintOthers(sessions.others);
  $("password").addEventListener("input", () => { $("password-hint").classList.toggle("met", $("password").value.length >= MIN_PASSWORD); });
  $("pw").addEventListener("input", () => { $("pw-saved").textContent = ""; $("pw-err").textContent = ""; });
  $("pw").onsubmit = async (e) => {
    e.preventDefault();
    $("pw-err").textContent = "";
    const fail = (message, id) => { $("pw-err").textContent = message; $(id).focus(); };
    if ($("current") && !$("current").value) return fail("Enter your current password.", "current");
    if ($("password").value.length < MIN_PASSWORD) return fail("Use at least 8 characters for your new password.", "password");
    if ($("password").value !== $("password2").value) return fail("The two new passwords don't match.", "password2");
    $("pw-go").disabled = true;
    try {
      await send("/api/auth/password", "POST", { current: $("current")?.value || "", password: $("password").value });
      if (me.has_password === false) { me.has_password = true; setTimeout(() => location.reload(), 900); }
      $("pw").reset();
      $("password-hint").classList.remove("met");
      paintOthers(0);
      $("pw-saved").textContent = "Password changed. Your other devices were logged out.";
    } catch (err) { $("pw-err").textContent = err.message; if (err.status >= 400 && err.status < 500) ($("current") || $("password")).focus(); }
    $("pw-go").disabled = false;
  };

  $("others-go").onclick = () => withBusy($("others-go"), async () => {
    const { ended } = await send("/api/auth/sessions", "DELETE");
    paintOthers(0);
    toast(`Logged out ${ended} other device${ended === 1 ? "" : "s"}`);
  });

  /* delete */
  $("del-go").onclick = () => {
    const d = document.createElement("dialog");
    d.className = "modal";
    d.innerHTML = `<h3>Delete your account?</h3>
      <p>It's deactivated now and deleted for good in ${DELETE_DAYS} days, with your agents, teams, projects and files. Log in before then to cancel.</p>
      <form id="del-form" novalidate>
        ${me.has_password === false ? "" : password("del-password", "Enter your password to confirm", "current-password")}
        <p class="perr" id="del-err" role="alert"></p>
        <div class="row"><button class="btn btn-ghost" type="button" data-close>Keep my account</button>
          <button class="btn btn-danger" id="del-yes">Deactivate my account</button></div>
      </form>`;
    document.body.append(d);
    wirePeek(d);
    d.addEventListener("close", () => d.remove());
    d.querySelector("[data-close]").onclick = () => d.close();
    d.showModal();
    d.querySelector("[data-close]").focus();          // the safe choice is the one under Enter
    d.querySelector("#del-form").onsubmit = async (e) => {
      e.preventDefault();
      $("del-err").textContent = "";
      if ($("del-password") && !$("del-password").value) { $("del-err").textContent = "Enter your password."; return $("del-password").focus(); }
      $("del-yes").disabled = true;
      try {
        const r = await send("/api/auth/delete", "POST", { password: $("del-password")?.value || "" });
        const day = new Date(r.delete_after * 1000).toLocaleDateString(getLocale(), { day: "numeric", month: "long", year: "numeric" });
        try { sessionStorage.setItem("atelier-toast", `Your account is deactivated. It will be deleted on ${day} unless you log in before then.`); } catch {}
        location.href = "/";
      } catch (err) { $("del-err").textContent = err.message; $("del-yes").disabled = false; }
    };
  };

}
load().catch(err => showError(app, err, () => location.reload(), "Something went wrong on this page"));   // a bug must not leave "Loading…" forever
</script>
</body>
</html>
