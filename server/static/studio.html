<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/static/logo.svg" type="image/svg+xml">
<meta name="theme-color" content="#0f1117">
<title>Studio · Agents Atelier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/static/base.css">
<script src="/static/i18n.js"></script>
<script src="/static/icons.js"></script>
<script src="/static/ui.js"></script>
<style>
  html, body { height: 100%; }
  body { display: grid; grid-template-columns: minmax(380px, 34%) 1fr; height: 100vh; overflow: hidden; }

  /* ---------- Chat column ---------- */
  .chat { position: relative; display: flex; flex-direction: column; border-inline-end: 1px solid var(--line); background: var(--paper); min-height: 0; }
  .bar { display: flex; align-items: center; gap: 10px; padding: 0 16px; height: 64px; border-bottom: 1px solid var(--line); flex: none; }
  .title { flex: 1; min-width: 0; }
  .title .name { font-size: 15px; font-weight: 500; letter-spacing: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    outline: none; border-radius: var(--r); padding: 1px 4px; margin-inline-start: -4px; cursor: text; }
  .title .name { min-height: 24px; }
  .title .name:hover { background: var(--linen); }
  .title .name:focus { background: var(--mist); box-shadow: 0 0 0 1px var(--espresso); }
  .title .sub { display: flex; align-items: center; gap: 6px; min-width: 0; font-size: 12px; color: var(--stone); line-height: 1.3; }
  .title .desc { min-height: 24px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; background: none; border: 0; padding: 0; color: inherit; font-size: inherit; text-align: start; }
  .title .desc:hover { color: var(--ink); }
  .title .desc.missing { color: var(--danger); }
  .title .pid { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; color: var(--stone); background: none; border: 0; padding: 0; flex: none; }
  .title .pid:hover { color: var(--ink); }
  .conn { width: 7px; height: 7px; border-radius: 50%; background: var(--line-strong); flex: none; }
  .conn.on { background: var(--ok); box-shadow: 0 0 0 3px rgb(var(--zellige-rgb) / .18); }
  .conn:not(.on) { animation: blink 1.4s infinite; }

  .chat { overflow: hidden; }

  /* messages */
  .messages { flex: 1; overflow-y: auto; padding: 20px 16px; display: flex; flex-direction: column; gap: 12px; background: var(--linen); }
  .empty { margin: auto; text-align: center; color: var(--stone); font-size: 15px; line-height: 1.6; max-width: 360px; border: 0; padding: 0 8px; }
  .empty .stack { display: flex; justify-content: center; margin-bottom: 20px; }
  .empty .stack span { width: 34px; height: 34px; border-radius: var(--r); background: var(--paper); box-shadow: var(--ring), 0 0 0 3px var(--linen);
    display: grid; place-items: center; color: var(--charcoal); margin-inline-start: -8px; }
  .empty h3 { color: var(--ink); font-weight: 400; font-size: 32px; letter-spacing: 0; line-height: 1.1; margin: 0 0 10px; }
  .chips { display: flex; flex-direction: column; gap: 8px; margin-top: 24px; }
  .uc-title { margin: 24px 0 10px; font-family: var(--mono); font-size: 12px; letter-spacing: .03em; color: var(--stone); }
  .usecases { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; width: 100%; text-align: start; }
  .uc { display: flex; flex-direction: column; gap: 4px; padding: 12px 14px; border: 0; border-radius: 8px; background: var(--paper); box-shadow: var(--ring); color: var(--ink); text-align: start; cursor: pointer; transition: background .15s, transform .15s; }
  .uc:hover { background: var(--ice); transform: translateY(-2px); }
  .uc b { font-size: 14px; font-weight: 500; }
  .uc small { font-size: 12px; line-height: 1.45; color: var(--graphite); }
  .uc span { display: inline-flex; align-items: center; gap: 4px; margin-top: 4px; font-size: 11px; color: var(--stone); }
  .uc-more { margin-top: 10px; padding: 0; border: 0; background: none; color: var(--graphite); font-size: 13px; text-decoration: underline; cursor: pointer; }
  .chip { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); padding: 9px 16px; font-size: 14px; color: var(--graphite);
    display: flex; align-items: center; gap: 8px; text-align: start; transition: border-color .2s, color .2s; }
  .chip:hover { border-color: var(--graphite); color: var(--ink); }
  .chip .ic { color: var(--stone); }

  .msg.keycard, .msg.limitcard { align-self: stretch; display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: start;
    padding: 14px 16px; border-radius: var(--r); background: var(--paper); box-shadow: var(--ring); font-size: 14px; line-height: 1.5; }
  .msg.keycard .tile, .msg.limitcard .tile { width: 36px; height: 36px; border-radius: var(--r); display: grid; place-items: center; background: var(--ice); color: var(--sky); }
  .msg.limitcard .tile { background: var(--linen); color: var(--saffron, var(--ink)); }
  .msg.keycard b, .msg.limitcard b { font-weight: 500; color: var(--ink); }
  .msg.keycard p, .msg.limitcard p { margin: 4px 0 10px; color: var(--graphite); font-size: 13px; }
  .msg.limitcard .lnk { font-size: 13px; }
  .msg.bcheck { padding: 12px 14px; border-radius: 8px; box-shadow: var(--ring); background: var(--paper); font-size: 13px; color: var(--graphite); }
  .msg.bcheck .head { display: flex; gap: 8px; align-items: flex-start; line-height: 1.5; }
  .msg.bcheck .head > .ic { margin-top: calc((1lh - 16px) / 2); color: var(--ok); }
  .msg.bcheck.warn .head > .ic { color: var(--saffron); }
  .msg.bcheck .shots { display: flex; gap: 8px; margin-top: 10px; }
  .msg.bcheck .shots a { flex: none; border-radius: 8px; overflow: hidden; box-shadow: var(--ring); }
  .msg.bcheck .shots img { display: block; height: 72px; width: auto; }
  .msg { max-width: 100%; font-size: 14px; line-height: 1.55; animation: pop .25s ease; }
  .replay .msg { animation: none; }
  @keyframes pop { from { opacity: 0; transform: translateY(6px); } }
  .msg.user { align-self: flex-end; background: var(--espresso); color: var(--on-espresso); padding: 10px 16px; border-radius: var(--r) 2px 2px 2px; max-width: 85%; white-space: pre-wrap; }
  .msg.agent { background: var(--paper); box-shadow: var(--ring); border-radius: var(--r); padding: 14px 16px; scroll-margin: 16px; transition: box-shadow .3s; }
  .msg.agent.highlight { box-shadow: inset 0 0 0 2px var(--ink); }
  /* states: working = blue outline and blue dots; done = green check; stopped = pause, quieter card */
  .msg.agent.working { box-shadow: inset 0 0 0 1.5px rgb(var(--sky-rgb) / .75); }
  .msg.agent.working .who .state { color: var(--sky); }
  .msg.agent.working .typing span { background: var(--sky); }
  .msg.agent .who .state > .ic:first-child { color: var(--ok); }
  .msg.agent.stopped .who .state, .msg.agent.stopped .who .state > .ic:first-child { color: var(--danger); }
  .msg.agent.stopped { box-shadow: inset 0 0 0 1px var(--line-strong); }
  /* agents working side by side: a blue rail on the cards that ran together */
  .msg.agent.par { border-inline-start: 3px solid rgb(var(--sky-rgb) / .6); }
  /* cards of earlier requests fold to their summary; the chevron opens the steps again */
  .msg.agent.past { padding-block: 10px; }
  .msg.agent.past .tile { width: 30px; height: 30px; }
  .msg.agent.past .who .nm { font-size: 14px; }
  .msg.agent.past:not(.open) .actions, .msg.agent.past:not(.open) .rate { display: none; }
  .msg.agent.past:not(.open) .text:not(:empty) { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-top: 6px; font-size: 13.5px; }
  .who .fold { width: 28px; height: 28px; color: var(--stone); }
  .who .fold .ic { transition: transform .2s; }
  .msg.agent.open .who .fold .ic { transform: rotate(180deg); }
  .who { display: flex; align-items: center; gap: 12px; }
  .tile { width: 36px; height: 36px; border-radius: var(--r); display: grid; place-items: center; flex: none; color: var(--ink);
    background: color-mix(in srgb, var(--c) 14%, var(--paper)); }
  .who .nm { font-weight: 500; font-size: 15px; letter-spacing: 0; }
  .who .nm small { display: block; font-weight: 400; font-size: 12px; color: var(--stone); letter-spacing: 0; }
  .who .state { margin-inline-start: auto; color: var(--stone); font-size: 12px; display: inline-flex; align-items: center; gap: 6px; font-feature-settings: "tnum"; white-space: nowrap; flex: none; }
  .who .nm { min-width: 0; }
  .who .nm, .who .nm small { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .typing { display: inline-flex; gap: 3px; }
  .typing span { width: 4px; height: 4px; border-radius: 50%; background: var(--ink); animation: blink 1s infinite; }
  .typing span:nth-child(2) { animation-delay: .15s; } .typing span:nth-child(3) { animation-delay: .3s; }
  .msg.agent .text { white-space: pre-wrap; color: var(--graphite); margin-top: 10px; font-size: 14.5px; line-height: 1.6; }
  .msg.agent .text:empty { display: none; }
  .actions { display: flex; flex-direction: column; gap: 4px; margin-top: 10px; padding: 8px 10px; background: var(--linen); border-radius: var(--r); }
  .actions:empty { display: none; }
  .action { display: flex; align-items: center; gap: 8px; font: 12.5px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--stone); min-width: 0; }
  .action b { color: var(--charcoal); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .action.hidden { display: none; }
  .actions.open .action.hidden { display: flex; }
  .more { align-self: flex-start; background: none; border: 0; padding: 2px 0; font-size: 12px; color: var(--ash); }
  .more:hover { color: var(--ink); text-decoration: underline; }
  .msg.system { align-self: center; font-size: 13px; color: var(--stone); text-align: center; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .msg.done-card { align-self: stretch; background: var(--paper); box-shadow: var(--ring); border-radius: var(--r); padding: 12px 14px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .msg.done-card .lbl { flex: 1; display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 500; min-width: 160px; }
  .msg.done-card .lbl .tile { --t: var(--zellige); --t-rgb: var(--zellige-rgb); width: 32px; height: 32px; }
  .msg.error { color: var(--danger); background: var(--paper); box-shadow: inset 0 0 0 1px var(--danger); border-radius: var(--r); padding: 10px 14px; font-size: 13px;
    white-space: pre-wrap; display: flex; align-items: flex-start; gap: 8px; line-height: 1.5; }
  .msg.error > .ic { margin-top: calc((1lh - 16px) / 2); }

  /* composer */
  /* one field: the prompt on top, its tools (attach, keys, team size, send) on a row below */
  .composer { padding: 12px 16px 14px; border-top: 1px solid var(--line); background: var(--paper); flex: none; }
  .composer .box { display: flex; flex-direction: column; border-radius: var(--r-card); background: var(--field); box-shadow: 0 0 0 1px var(--line-strong); transition: box-shadow .15s; }
  .composer .box:focus-within { box-shadow: 0 0 0 1.5px var(--sky); }
  .composer textarea, .composer textarea.input, .composer textarea.input:focus { flex: 1; resize: none; max-height: 200px; min-height: 44px; line-height: 1.5; width: 100%;
    background: transparent; box-shadow: none; border: 0; padding: 11px 14px 2px; font-size: 15px; }
  .composer textarea:disabled { cursor: default; }
  .composer .row { display: flex; gap: 6px; align-items: center; padding: 2px 6px 6px; min-width: 0; }
  .composer .row .spacer { flex: 1; }
  .send { height: 36px; width: 36px; border: 0; border-radius: var(--r-pill); background: var(--sky); color: var(--on-sky); display: grid; place-items: center; flex: none; transition: background .2s, opacity .2s; }
  .send:hover { filter: brightness(1.12); }
  .send:disabled { opacity: .35; cursor: default; filter: none; background: var(--steel); color: var(--stone); }
  .send.stop { background: var(--paper); color: var(--danger); box-shadow: inset 0 0 0 1.5px var(--danger); }
  .composer .hint { font-size: 11.5px; color: var(--stone); min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .composer .team-hint { font-size: 12px; color: var(--stone); white-space: nowrap; }
  .composer .attach { width: 34px; height: 34px; color: var(--graphite); }
  body.viewer .composer .row { display: none; }
  body.viewer .composer textarea { padding-bottom: 11px; min-height: 68px; }   /* room for the two-line "you're a viewer" note */
  kbd { font: 11px ui-monospace, monospace; background: var(--linen); border-radius: var(--r); padding: 1px 5px; box-shadow: var(--ring); }

  /* ---------- Stage column ---------- */
  .stage { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .toolbar { display: flex; align-items: center; gap: 8px; padding: 0 16px; height: 64px; border-bottom: 1px solid var(--line); background: var(--paper); flex: none; }
  .seg { display: flex; background: var(--linen); box-shadow: var(--ring); border-radius: var(--r); padding: 3px; }
  .seg button { background: transparent; border: 0; padding: 6px 12px; border-radius: var(--r); font-size: 13px; color: var(--stone); display: inline-flex; align-items: center; gap: 6px; }
  .seg button:hover { color: var(--ink); }
  .seg button.on { background: var(--paper); color: var(--ink); box-shadow: var(--ring); }
  .spacer { flex: 1; }
  .url { font: 12px ui-monospace, monospace; color: var(--stone); max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    background: var(--linen); border-radius: var(--r); padding: 6px 12px; }

  .view { flex: 1; position: relative; min-height: 0; background: var(--bone); }
  .frame-wrap { position: absolute; inset: 0; display: flex; justify-content: center; padding: 20px; }
  .frame-wrap iframe { width: 100%; height: 100%; border: 0; border-radius: var(--r); background: #fff; box-shadow: var(--ring); transition: width .35s ease; }
  .frame-wrap.tablet iframe { width: 768px; } .frame-wrap.phone iframe { width: 375px; }
  .flash { position: absolute; inset: 20px; border-radius: var(--r); pointer-events: none; box-shadow: inset 0 0 0 2px var(--c, var(--ink)); opacity: 0; transition: opacity .6s; }
  .flash.show { opacity: 1; transition: none; }
  .placeholder { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 20px; }
  .placeholder .box { color: var(--stone); font-size: 15px; max-width: 300px; line-height: 1.55; }
  .placeholder .box .tile { --c: var(--stone); width: 52px; height: 52px; border-radius: var(--r); margin: 0 auto 16px; color: var(--charcoal); }
  .placeholder b { display: block; color: var(--ink); font-weight: 500; font-size: 17px; margin-bottom: 4px; }

  .code { position: absolute; inset: 0; display: none; grid-template-columns: 200px 1fr; background: var(--paper); }
  .code.on { display: grid; }
  .code.nofiles { grid-template-columns: 1fr; }
  .code.nofiles .files, .code.nofiles .codehead { display: none; }
  .research { position: absolute; inset: 0; display: none; overflow: auto; background: var(--paper); }
  .research.on { display: block; }
  .research .doc { max-width: 780px; margin: 0 auto; padding: 32px 24px 64px; color: var(--graphite); font-size: 15px; line-height: 1.65; }
  .research .doc h1 { font-size: 26px; line-height: 1.25; color: var(--ink); font-weight: 600; margin: 0 0 6px; }
  .research .doc h2 { font-size: 19px; color: var(--ink); font-weight: 600; margin: 32px 0 10px; padding-top: 16px; border-top: 1px solid var(--line); }
  .research .doc h3 { font-size: 16px; color: var(--ink); font-weight: 600; margin: 20px 0 6px; }
  .research .doc p { margin: 0 0 12px; }
  .research .doc ul, .research .doc ol { margin: 0 0 12px; padding-inline-start: 22px; }
  .research .doc li { margin: 4px 0; }
  .research .doc a { color: var(--ink); text-decoration: underline; text-underline-offset: 2px; overflow-wrap: anywhere; }
  .research .doc a.cite { text-decoration: none; font-size: 12px; vertical-align: super; line-height: 0; padding: 0 1px; }
  .research .doc code { font: 13px ui-monospace, monospace; background: var(--linen); padding: 1px 5px; border-radius: var(--r); }
  .research .doc blockquote { margin: 0 0 12px; padding: 4px 14px; border-inline-start: 3px solid var(--line-strong); color: var(--stone); }
  .research .doc hr { border: 0; border-top: 1px solid var(--line); margin: 24px 0; }
  .research .doc .tbl { overflow-x: auto; margin: 0 0 14px; }
  .research .doc table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
  .research .doc th, .research .doc td { text-align: start; vertical-align: top; padding: 8px 10px; border-bottom: 1px solid var(--line); }
  .research .doc th { color: var(--ink); font-weight: 600; background: var(--linen); }
  .research .doc li:target { background: var(--linen); }
  .research .bar { position: sticky; top: 0; display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 12px; height: auto; padding: 14px 24px 12px; background: var(--paper);
    border-bottom: 1px solid var(--line); font-size: 13px; color: var(--stone); z-index: 1; }
  .research .bar h2 { margin: 0; font-size: 20px; font-weight: 500; color: var(--ink); }
  .placeholder .ph-acts { display: flex; justify-content: center; gap: 8px; margin-top: 16px; }
  .files { border-inline-end: 1px solid var(--line); padding: 10px; overflow-y: auto; background: var(--linen); }
  [dir="rtl"] .files { border-inline-end: 0; border-inline-start: 1px solid var(--line); }   /* the list reads left to right, but sits on the right */
  .files button { display: flex; align-items: center; gap: 8px; width: 100%; text-align: start; background: transparent; border: 0; padding: 8px 12px; border-radius: var(--r);
    font: 13px ui-monospace, monospace; color: var(--graphite); }
  .files button span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .files button.on, .files button:hover { background: var(--paper); color: var(--ink); box-shadow: var(--ring); }
  .files button.changed::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--ink); flex: none; }
  .codehead { display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-bottom: 1px solid var(--line); font: 12px ui-monospace, monospace; color: var(--stone); }
  .codepane { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  pre { margin: 0; padding: 20px; overflow: auto; flex: 1; font: 12.5px/1.65 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--charcoal); tab-size: 2; }

  /* ---------- page switcher ---------- */
  .page-pick { position: relative; display: inline-flex; align-items: center; gap: 6px; height: 36px; padding-inline: 12px 30px; border-radius: var(--r);
    background: var(--linen); box-shadow: var(--ring); color: var(--stone); font-size: 13px; max-width: 220px; }
  .page-pick select { appearance: none; border: 0; background: transparent; color: var(--ink); font: inherit; font-size: 13px; outline: none; cursor: pointer; min-width: 0; width: 100%; text-overflow: ellipsis; }
  .page-pick:focus-within { box-shadow: inset 0 0 0 1.5px var(--sky); }
  .page-pick::after { content: ""; position: absolute; inset-inline-end: 12px; top: 50%; width: 6px; height: 6px; border: solid var(--stone); border-width: 0 1.5px 1.5px 0; transform: translateY(-70%) rotate(45deg); pointer-events: none; }
  .page-pick select option { background: var(--paper); color: var(--ink); }

  /* ---------- editor ---------- */
  textarea.editor { flex: 1; width: 100%; border: 0; outline: none; resize: none; margin: 0; padding: 20px; background: var(--paper);
    font: 12.5px/1.65 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--charcoal); tab-size: 2; white-space: pre; overflow: auto; }
  textarea.editor[readonly] { background: var(--linen); color: var(--graphite); }
  .codehead { gap: 10px; min-height: 48px; padding: 8px 12px 8px 16px; }
  .codehead #codeName { color: var(--ink); }
  .dirty-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ink); }
  .save-state { font: 12px var(--font); color: var(--stone); display: inline-flex; align-items: center; gap: 5px; }
  .save-state.err { color: var(--danger); }
  .autosave { display: inline-flex; align-items: center; gap: 8px; font: 12px var(--font); color: var(--graphite); cursor: pointer; }
  .autosave input { appearance: none; width: 32px; height: 20px; border-radius: var(--r-field); background: var(--line-strong); position: relative; cursor: pointer; margin: 0; transition: background .2s; }
  .autosave input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: var(--knob); transition: transform .2s; }
  .autosave input:checked { background: var(--espresso); }
  .autosave input:checked::after { transform: translateX(12px); }

  .file-note { flex: 1; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--graphite); font-size: 14px; background: var(--linen); overflow: auto; }
  .file-note img { max-width: 100%; max-height: 60vh; border-radius: var(--r); box-shadow: var(--ring); background: #fff; display: block; margin: 0 auto 12px; }
  .file-note .tile { --c: var(--stone); width: 48px; height: 48px; border-radius: var(--r); margin: 0 auto 12px; }
  .file-note b { display: block; color: var(--ink); font-weight: 500; margin-bottom: 4px; }
  .file-note p { margin: 0 auto; max-width: 380px; line-height: 1.55; }
  .files button small { font: 11px var(--font); color: var(--stone); flex: none; }
  .files-total { font-size: 11px; color: var(--stone); padding: 10px 12px 4px; border-top: 1px solid var(--line); margin-top: 8px; }
  .fatal { position: fixed; inset: 0; z-index: 200; background: var(--linen); display: grid; place-items: center; padding: 24px; }
  .fatal .row { display: flex; gap: 8px; justify-content: center; }

  /* ---------- attachments ---------- */
  /* attached images: chips with a thumbnail, the file name and where the upload is */
  .attachments { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .attachments[hidden] { display: none; }
  .att { position: relative; display: inline-flex; align-items: center; gap: 8px; max-width: 220px; min-width: 0; padding: 4px; padding-inline-end: 4px;
    border-radius: var(--r-pill); background: var(--linen); box-shadow: var(--ring); font-size: 12px; }
  .att img { width: 32px; height: 32px; object-fit: cover; display: block; border-radius: 5px; background: var(--bone); flex: none; }
  .att .att-meta { display: grid; min-width: 0; line-height: 1.25; }
  .att .att-meta b { font-weight: 500; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .att .att-meta small { color: var(--stone); font-size: 11px; white-space: nowrap; }
  .att.failed { box-shadow: inset 0 0 0 1.5px var(--danger); }
  .att.failed .att-meta small { color: var(--danger); }
  .att.failed img { opacity: .45; }
  .att.loading img { animation: blink 1s infinite; }
  .att button { width: 24px; height: 24px; border-radius: var(--r); border: 0; background: transparent; color: var(--stone); display: grid; place-items: center; padding: 0; flex: none; }
  .att button:hover { background: var(--ice); color: var(--ink); }
  .att .reup { color: var(--danger); }
  .composer.drag .box { box-shadow: 0 0 0 2px var(--sky); background: var(--ice); }
  .msg.user .imgs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .msg.user .imgs img { width: 72px; height: 72px; object-fit: cover; border-radius: var(--r); display: block; background: rgb(var(--on-espresso-rgb) / .15); }

  /* ---------- retry + cost on agent cards ---------- */
  .who .retry { margin-inline-start: 4px; width: 28px; height: 28px; }
  .msg.agent.working .retry { display: none; }
  .msg.agent .rate { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 6px; margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--line); font-size: 12px; color: var(--stone); }
  .msg.agent .rate .icon-btn { width: 28px; height: 28px; }
  .msg.agent .rate .icon-btn.on { color: var(--zellige); background: rgb(var(--zellige-rgb) / .15); }
  .msg.agent .rate .icon-btn.on.bad { color: var(--danger); background: color-mix(in srgb, var(--danger) 14%, transparent); }
  .msg.agent .rate .link { border: 0; background: none; padding: 0 4px; font-size: 12px; color: var(--graphite); text-decoration: underline; cursor: pointer; }
  .done-card .showcase { flex-basis: 100%; display: flex; gap: 8px; align-items: center; margin-top: 6px; font-size: 12px; color: var(--graphite); cursor: pointer; }
  .done-card .showcase input { width: 16px; height: 16px; accent-color: var(--sky); margin: 0; }
  .msg.agent .rate .said { flex-basis: 100%; color: var(--graphite); font-style: italic; }
  .who .cost { font-feature-settings: "tnum"; }
  .model-badge { display: inline-flex; white-space: nowrap; max-width: 130px; overflow: hidden; text-overflow: ellipsis; align-items: center; gap: 3px; text-decoration: none; font: 10.5px var(--font); color: var(--stone); background: var(--paper); box-shadow: var(--ring); border-radius: var(--r); padding: 1px 6px; line-height: 1.5; }
  .agent-tile.s-working .model-badge { background: rgb(var(--on-espresso-rgb) / .12); color: rgb(var(--on-espresso-rgb) / .8); box-shadow: none; }

  /* ---------- presets menu ---------- */
  .menu-wrap { position: relative; }
  .menu { position: absolute; bottom: calc(100% + 8px); right: 0; z-index: 30; width: 300px; background: var(--paper); border-radius: var(--r); padding: 6px;
    box-shadow: var(--ring), var(--hard); display: none; }
  .menu.open { display: block; }
  .menu .mi { display: flex; align-items: flex-start; gap: 10px; width: 100%; text-align: start; background: none; border: 0; padding: 10px 12px; border-radius: var(--r); font-size: 14px; text-decoration: none; color: inherit; }
  .menu .mi:hover { background: var(--linen); }
  .menu .mi { line-height: 20px; }
  .menu .mi > .ic { margin-top: calc((20px - 15px) / 2); color: var(--stone); }
  .menu .mi small { line-height: 1.4; }
  .menu .mi b { font-weight: 500; display: flex; align-items: center; gap: 6px; }
  .menu .mi small { display: block; color: var(--stone); font-size: 12px; margin-top: 2px; line-height: 1.4; }
  .menu .mi.on { background: var(--bone); }
  .menu .mi .del { margin-inline-start: auto; color: var(--stone); padding: 2px; border-radius: var(--r); }
  .menu .mi .del:hover { color: var(--danger); }
  .menu hr { border: 0; border-top: 1px solid var(--line); margin: 6px 4px; }

  .note { font-size: 13px; color: var(--stone); margin: 0 0 16px; display: flex; gap: 8px; align-items: flex-start; line-height: 1.5; }
  .note > .ic { margin-top: calc((1lh - 14px) / 2); }

  .vlist { display: flex; flex-direction: column; gap: 6px; }
  .vrow { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 14px; align-items: center; background: var(--paper); border-radius: var(--r); padding: 10px 14px; }
  .vrow .vn { font: 12px ui-monospace, monospace; color: var(--stone); text-align: center; }
  .vrow .vn .tile { width: 34px; height: 34px; border-radius: var(--r); margin: 0 auto 4px; }
  .vrow b { font-weight: 500; font-size: 14.5px; }
  .vrow small { display: block; font-size: 12px; color: var(--stone); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .vrow .vact { display: flex; gap: 2px; align-items: center; }
  .vrow.current { box-shadow: inset 0 0 0 1.5px rgb(var(--sky-rgb) / .5); }
  .vrow.current .badge { background: var(--ice); color: var(--sky); }
  #versionsBody, #statsBody { container-type: inline-size; min-width: 0; display: grid; gap: 12px; align-content: start; }
  #versionsBody > *, #statsBody > * { margin-block: 0; min-width: 0; }
  @container (max-width: 560px) {
    .vrow { grid-template-columns: 36px minmax(0, 1fr); gap: 8px 12px; }
    .vrow .vn .tile { width: 30px; height: 30px; }
    .vrow .vact { grid-column: 1 / -1; justify-content: flex-end; border-top: 1px solid var(--line); padding-top: 6px; }
  }
  /* the diff: a toolbar, then one block per file with old / new line numbers on the side */
  .diff-head { display: flex; align-items: center; gap: 10px 12px; flex-wrap: wrap; }
  .diff-head .note { margin: 0; }
  .diff-head .chk { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--graphite); cursor: pointer; }
  .diff-head .chk input { width: 16px; height: 16px; margin: 0; accent-color: var(--sky); }
  .diff-sum { display: inline-flex; gap: 8px; font: 12px ui-monospace, monospace; }
  .plus { color: var(--ok); } .minus { color: var(--danger); }
  .diffs { display: grid; gap: 10px; min-width: 0; }
  .difffile { background: var(--paper); border-radius: var(--r); overflow: hidden; box-shadow: var(--ring); min-width: 0; }
  .difffile summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 10px; padding: 10px 14px; font: 13px ui-monospace, monospace; min-width: 0; }
  .difffile summary:hover { background: var(--mist); }
  .difffile[open] summary { border-bottom: 1px solid var(--line); }
  .difffile summary::-webkit-details-marker { display: none; }
  .difffile summary .chev { color: var(--stone); transition: transform .2s; transform: rotate(-90deg); }
  [dir="rtl"] .difffile summary .chev { transform: rotate(90deg); }
  .difffile[open] summary .chev { transform: none; }
  .difffile .dpath { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .difffile.added .badge { background: var(--add-bg); color: var(--add-fg); }
  .difffile.removed .badge { background: var(--del-bg); color: var(--del-fg); }
  .difffile pre { margin: 0; padding: 0 0 8px; font: 12px/1.65 ui-monospace, monospace; overflow-x: auto; color: var(--charcoal); }
  .difffile .dl { display: grid; grid-template-columns: 3.6em 3.6em max-content; width: max-content; min-width: 100%; background: var(--paper); }
  .difffile .ln { position: sticky; inset-inline-start: 0; font-style: normal; text-align: end; padding-inline-end: 10px; color: var(--stone); opacity: .8; background: inherit; user-select: none; }
  .difffile .ln + .ln { inset-inline-start: 3.6em; box-shadow: inset -1px 0 0 var(--line); }
  .difffile .tx { white-space: pre; padding-inline: 10px 16px; }
  .difffile .dl.a { background: var(--add-bg); color: var(--add-fg); }
  .difffile .dl.r { background: var(--del-bg); color: var(--del-fg); }
  .difffile .dl.h { background: var(--linen); color: var(--stone); }
  .diffs.wrap .dl { grid-template-columns: 3.6em 3.6em minmax(0, 1fr); width: auto; }
  .diffs.wrap .tx { white-space: pre-wrap; overflow-wrap: anywhere; }

  .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
  .kpi { background: var(--paper); border-radius: var(--r); padding: 14px 16px; min-width: 0; }
  .kpi b { display: block; font-weight: 400; font-size: 26px; letter-spacing: 0; line-height: 1.15; font-feature-settings: "tnum"; }
  .kpi span { font-size: 12px; color: var(--stone); }
  .tbl-wrap { overflow-x: auto; border-radius: var(--r-card); box-shadow: var(--ring); background: var(--paper); }
  .stable { width: 100%; border-collapse: separate; border-spacing: 0; background: var(--paper); font-size: 13.5px; }
  .stable th { text-align: start; font-weight: 500; font-size: 11.5px; color: var(--stone); background: var(--mist); padding: 10px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  .stable td { padding: 9px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; font-feature-settings: "tnum"; white-space: nowrap; }
  .stable tbody tr:hover td { background: var(--mist); }
  .stable tr:last-child td { border-bottom: 0; }
  .stable td.num, .stable th.num { text-align: end; }
  .stable td.num b { font-weight: 500; }
  .stable .muted { color: var(--stone); }
  .stable td.c-model { font-size: 12px; color: var(--graphite); }
  .stable td.c-req { max-width: 280px; overflow: hidden; text-overflow: ellipsis; color: var(--graphite); }
  .stable .ag { display: flex; align-items: center; gap: 10px; }
  .stable .ag .tile { width: 26px; height: 26px; border-radius: var(--r); }
  .sbar { height: 6px; border-radius: var(--r); background: var(--linen); min-width: 72px; overflow: hidden; }
  .sbar i { display: block; height: 100%; border-radius: var(--r); background: var(--sky); }
  .status-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); margin-inline-end: 8px; vertical-align: 1px; }
  .status-dot.stopped { background: var(--stone); } .status-dot.error { background: var(--danger); }
  h4.sec { margin: 8px 0 0; font-weight: 500; font-size: 14px; color: var(--charcoal); }
  #statsBody h4.sec { margin-top: 12px; }
  @container (max-width: 720px) {
    .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .stable .c-bar, .stable .c-avg { display: none; }
  }
  @container (max-width: 480px) {
    .stable .c-model, .stable .c-tok { display: none; }
    .stable td.c-req { max-width: 120px; }
    .stable th, .stable td { padding-inline: 10px; }
  }

  /* security warnings */
  .msg.security { align-self: stretch; background: var(--paper); border-radius: var(--r); padding: 14px 16px;
    box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--danger) 40%, transparent); }
  .msg.security .head { display: flex; gap: 10px; align-items: flex-start; color: var(--danger); font-size: 14px; line-height: 1.45; }
  .msg.security .head b { font-weight: 500; }
  .msg.security ul { margin: 8px 0 0; margin-inline-start: 28px; padding: 0; font: 12px/1.6 ui-monospace, monospace; color: var(--graphite); }
  .msg.security p { margin: 8px 0 0; margin-inline-start: 28px; font-size: 13px; color: var(--stone); }
  .msg.orch { align-self: stretch; background: var(--paper); box-shadow: var(--ring); border-radius: var(--r); padding: 14px 16px; }
  .msg.orch .head { display: flex; gap: 10px; align-items: center; font-size: 14px; }
  .msg.orch .head b { font-weight: 500; }
  .msg.orch .head .state { margin-inline-start: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--stone); }
  .msg.orch:not(.working) .head .typing { display: none; }
  .msg.orch .why { margin: 8px 0 0; font-size: 14px; line-height: 1.55; color: var(--graphite); white-space: pre-wrap; }
  .msg.orch .why:empty { display: none; }
  .msg.orch .picks { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .msg.orch .picks span { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 4px 8px; border-radius: var(--r); box-shadow: inset 0 0 0 1px var(--line-strong); color: var(--ink); }
  .msg.orch .picks svg { flex-shrink: 0; display: block; }
  .msg.orch .note { margin: 8px 0 0; font-size: 12px; color: var(--stone); }
  /* The Orchestrator asks: a short form, or a plan waiting for a yes */
  .msg.orch.asking { box-shadow: inset 0 0 0 1.5px rgb(var(--sky-rgb) / .55); }
  .ask { display: grid; gap: 16px; margin-top: 14px; }
  .ask fieldset { border: 0; margin: 0; padding: 0; min-width: 0; display: grid; gap: 8px; }
  .ask legend { display: flex; align-items: baseline; gap: 8px; padding: 0; margin-bottom: 8px; font-size: 14px; font-weight: 500; color: var(--ink); line-height: 1.4; }
  .ask legend .num { flex-shrink: 0; min-width: 20px; height: 20px; display: inline-grid; place-items: center; border-radius: var(--r-pill); background: var(--ice); color: var(--sky); font-size: 12px; font-variant-numeric: tabular-nums; }
  .ask .opts { display: flex; flex-wrap: wrap; gap: 8px; }
  .ask .opt { position: relative; display: inline-flex; min-width: 0; }
  .ask .opt input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
  .ask .opt span { display: inline-flex; align-items: center; gap: 6px; min-height: 34px; padding: 6px 12px; border-radius: var(--r-pill); background: var(--paper);
                   box-shadow: var(--ring); font-size: 13px; line-height: 1.3; color: var(--ink); transition: background .15s, box-shadow .15s; }
  .ask .opt span svg { width: 14px; height: 14px; flex-shrink: 0; display: none; color: var(--sky); }
  .ask .opt:hover span { background: var(--ice); }
  .ask .opt input:checked + span { background: var(--ice); box-shadow: inset 0 0 0 1.5px var(--sky); }
  .ask .opt input:checked + span svg { display: block; }
  .ask .opt input:focus-visible + span { outline: 2px solid var(--sky); outline-offset: 2px; }
  .ask .free { width: 100%; min-width: 0; height: 36px; padding: 0 12px; border: 0; border-radius: var(--r-field); background: var(--field); color: var(--ink); font: inherit; font-size: 13px; }
  .ask .free:focus-visible { outline: 2px solid var(--sky); outline-offset: 1px; }
  .ask .ask-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding-top: 4px; }
  .ask .ask-bar .hint { margin-inline-start: auto; font-size: 12px; color: var(--stone); }
  .ask .btn[aria-busy="true"] { opacity: .7; pointer-events: none; }
  .ask .done { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--stone); }
  .ask .done svg { width: 14px; height: 14px; flex-shrink: 0; display: block; color: var(--ok); }
  .msg.orch.answered .ask fieldset { opacity: .55; }
  .msg.orch.answered .ask .opt input { cursor: default; }
  .msg.user .qa { display: grid; gap: 6px; margin: 0; white-space: normal; }
  .msg.user .qa dt { font-size: 12px; opacity: .7; }
  .msg.user .qa dd { margin: 0 0 4px; }
  @media (max-width: 640px) { .ask .ask-bar .hint { margin-inline-start: 0; flex-basis: 100%; } }
  .msg.sendback { align-self: stretch; background: var(--paper); box-shadow: var(--ring); border-radius: var(--r); padding: 14px 16px; }
  .msg.sendback .head { display: flex; gap: 10px; align-items: center; font-size: 14px; }
  .msg.sendback .head b { font-weight: 500; }
  .msg.sendback ul { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 8px; }
  .msg.sendback li { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; line-height: 1.5; color: var(--graphite); }
  .msg.sendback li .who { flex-shrink: 0; display: inline-flex; align-items: center; gap: 6px; font-weight: 500; color: var(--ink); min-width: 120px; }
  .msg.sendback li .who svg { flex-shrink: 0; display: block; }

  /* resume card (after a stop / error) */
  .msg.resume-card { align-self: stretch; background: var(--paper); box-shadow: inset 0 0 0 1px var(--line-strong); border-radius: var(--r); padding: 14px 16px;
    display: flex; flex-direction: column; gap: 12px; }
  .resume-card .rc-text { display: flex; align-items: center; gap: 12px; }
  .resume-card .rc-text .tile { --c: var(--stone); }
  .resume-card.error .rc-text .tile { --c: var(--danger); color: var(--danger); }
  .resume-card b { display: block; font-weight: 500; font-size: 15px; }
  .resume-card small { display: block; font-size: 13px; color: var(--stone); margin-top: 2px; line-height: 1.4; }
  .resume-card .rc-actions { display: flex; gap: 8px; flex-wrap: wrap; padding-inline-start: 48px; }
  .resume-card.used { box-shadow: var(--ring); opacity: .75; }
  .resume-card.used .rc-actions { display: none; }

  /* ---------- team panel ---------- */
  .team { border-top: 1px solid var(--line); background: var(--paper); flex: none; position: relative; }
  .progress { position: absolute; top: -1px; left: 0; height: 3px; background: var(--sky); box-shadow: 0 0 0 1px var(--line-strong); width: 0; transition: width .6s cubic-bezier(.2, .7, .2, 1); }
  .team-head { display: flex; align-items: center; gap: 8px 10px; padding: 8px 16px; min-height: 50px; flex-wrap: wrap; }
  .team-head h3 { margin: 0; font-size: 14px; font-weight: 500; letter-spacing: 0; display: flex; align-items: center; gap: 8px; }
  .team-head .count { font-size: 13px; color: var(--stone); }
  /* one run of text (not flex items), so "Step 2 of 4 · …" keeps normal word spacing */
  .team-head .now { display: block; min-width: 0; font-size: 13px; color: var(--graphite); line-height: 1.4; }
  .team-head .now .typing { margin-inline-end: 6px; vertical-align: middle; }
  .team-head .now .typing span { background: var(--sky); }
  .team-head .now b { color: var(--ink); font-weight: 500; }
  .team-head .clock { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--graphite); background: var(--linen); border-radius: var(--r); padding: 5px 10px; font-feature-settings: "tnum"; }
  .team-head a.lnk { color: var(--graphite); text-decoration: none; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; padding: 6px 10px; border-radius: var(--r); }
  .team-head a.lnk:hover { color: var(--ink); background: var(--linen); }
  .team.collapsed .team-row { display: none; }
  .team.collapsed .team-head { min-height: 50px; }

  /* compact tiles: icon, name, number and model on top, the state below; the description is in the tooltip */
  .team-row { display: flex; gap: 8px; padding: 2px 16px 12px; overflow-x: auto; scroll-snap-type: x proximity; scroll-padding: 16px; }
  .agent-tile { position: relative; flex: none; width: 196px; min-height: 0; border-radius: var(--r); padding: 10px 10px 9px; background: var(--linen); box-shadow: var(--ring);
    display: flex; flex-direction: column; gap: 6px; cursor: pointer; scroll-snap-align: start; text-align: start; transition: background .25s, color .25s, opacity .25s, transform .15s; }
  .agent-tile:hover { box-shadow: inset 0 0 0 1px var(--line-strong); }
  .agent-tile:active { transform: scale(.985); }
  .agent-tile .t-top { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .agent-tile .tile { width: 30px; height: 30px; border-radius: var(--r); }
  .agent-tile .t-id { flex: 1; min-width: 0; display: grid; gap: 1px; }
  .agent-tile .t-meta { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .agent-tile .t-num { font: 10.5px ui-monospace, monospace; color: var(--stone); }
  .agent-tile .t-name { font-size: 13.5px; font-weight: 500; letter-spacing: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.3; }
  .agent-tile .t-status { font-size: 12px; color: var(--stone); display: flex; align-items: center; gap: 6px; font-feature-settings: "tnum"; min-width: 0; white-space: nowrap; }
  .agent-tile .t-last { font: 11.5px ui-monospace, monospace; color: var(--stone); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-height: 15px; margin-top: -2px; }
  .agent-tile .t-desc { display: none; }
  .agent-tile .model-badge { max-width: 96px; }

  .sw { width: 32px; height: 20px; border-radius: var(--r-field); border: 0; padding: 0; background: var(--line-strong); position: relative; flex: none; transition: background .2s; }
  .sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: var(--knob); transition: transform .2s; }
  .sw.on { background: var(--espresso); }
  .sw.on::after { transform: translateX(12px); }
  .sw:disabled { opacity: .5; cursor: default; }

  .agent-tile.s-skipped { opacity: .6; }
  .agent-tile .t-remove { width: 26px; height: 26px; margin-block: -4px; margin-inline-end: -4px; color: var(--stone); align-self: flex-start; }
  .agent-tile .t-lock { align-self: flex-start; padding-top: 2px; }
  .agent-tile .t-remove:hover { color: var(--danger); }
  .agent-tile .t-lock { color: var(--stone); display: inline-flex; }
  .agent-tile.s-working .t-remove, .agent-tile.s-working .t-lock { color: inherit; }
  .add-tile { display: flex; flex-direction: row; align-items: center; justify-content: flex-start; gap: 10px; text-align: start; text-decoration: none;
    background: transparent; box-shadow: none; border: 1px dashed var(--line-strong); color: var(--graphite); }

  .pj-imgs .an small { font-size: 12px; color: var(--stone); line-height: 1.4; }
  .pj-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .pj-chips span { font-size: 11px; padding: 2px 8px; border-radius: var(--r-pill); background: var(--linen); color: var(--graphite); white-space: nowrap; }
  .pj-chips span.save { background: var(--add-bg); color: var(--add-fg); }
  .pj-qrs { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
  .pj-qrs figure { margin: 0; display: grid; gap: 8px; justify-items: center; padding: 12px; border-radius: var(--r); background: var(--linen); text-align: center; }
  .pj-qrs img { width: 112px; height: 112px; background: #fff; padding: 6px; border-radius: var(--r); display: block; }
  .pj-qrs figcaption { font: 12px var(--mono); color: var(--graphite); overflow-wrap: anywhere; }
  .pj-swatches { display: flex; flex-wrap: wrap; gap: 8px; }
  .pj-brief { margin: 0; display: grid; grid-template-columns: minmax(110px, 30%) 1fr; gap: 8px 16px; font-size: 13px; line-height: 1.45; }
  .pj-brief dt { color: var(--stone); }
  .pj-brief dd { margin: 0; color: var(--ink); overflow-wrap: anywhere; }
  @media (max-width: 640px) {
    .pane-in { padding: 16px; }
    .pj-brief { grid-template-columns: 1fr; gap: 2px; }
    .pj-brief dd { margin-bottom: 8px; }
  }

  .m-switch { display: none; }
  @media (max-width: 900px) {
    body { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); height: 100vh; height: 100dvh; }
    .m-switch { display: flex; gap: 4px; padding: 6px 10px; background: var(--paper); border-bottom: 1px solid var(--line); grid-row: 1; }
    .m-switch button { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 8px; position: relative;
      padding: 8px; border: 0; border-radius: var(--r); background: transparent; color: var(--graphite); font: inherit; font-size: 14px; cursor: pointer; }
    .m-switch button[aria-selected="true"] { background: var(--linen); color: var(--ink); font-weight: 500; box-shadow: var(--ring); }
    .m-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--sky); }
    .chat, .stage { grid-row: 2; grid-column: 1; }
    body[data-m="chat"] .stage, body:not([data-m]) .stage { display: none; }
    body[data-m="site"] .chat { display: none; }
    .chat { border-inline-end: 0; }
    .code { grid-template-columns: 140px 1fr; }
    .m-switch { position: relative; }
    .m-progress { position: absolute; inset-inline-start: 0; bottom: -1px; height: 2px; width: 0; background: var(--sky); transition: width .6s cubic-bezier(.2, .7, .2, 1); }
  }
  body > * { min-width: 0; }               /* a column never grows past the screen because of its content */
  @media (max-width: 520px) {
    .team-head .tlbl { display: none; }
    .team-head { flex-wrap: nowrap; }
    .bar { gap: 6px; padding: 0 10px; }
    .title .pid, .title .sub > span[aria-hidden] { display: none; }
    .composer { padding: 10px 10px 12px; }
    .composer .hint { display: none; }          /* phones have no Enter / Shift+Enter to explain */
  }

  /* ---------- the tab bar and preview tools fit any width: labels give way to icons (the open tab keeps its name) ---------- */
  .stage { container: stage / inline-size; }
  .chat { container: chat / inline-size; }
  .toolbar { min-width: 0; }
  #tabs { min-width: 0; flex: 0 1 auto; overflow-x: auto; scrollbar-width: none; }
  #tabs::-webkit-scrollbar { display: none; }
  #tabs button { flex: none; white-space: nowrap; }
  .pv-bar .page-pick { flex: 0 1 auto; min-width: 0; }
  #download { flex: none; }
  @container stage (max-width: 820px) {
    #tabs button:not(.on) .lbl { display: none; }
    #tabs button { padding-inline: 10px; }
  }
  @container stage (max-width: 600px) {
    .toolbar { height: 52px; padding: 0 10px; gap: 6px; }
    #download { width: 36px; padding: 0; }
    #download .lbl { display: none; }
    .pv-bar { padding: 6px 10px; gap: 6px; }
    .pv-bar .url { display: none; }
    .frame-wrap { padding: 8px; }
    .flash { inset: 8px; }
  }
  @container chat (max-width: 450px) { .title .pid, .title .sub > span[aria-hidden] { display: none; } }
  @container chat (max-width: 420px) { .composer .hint { display: none; } }
</style>

<body>

<nav class="m-switch" id="mSwitch" role="tablist" aria-label="Show">
  <button type="button" role="tab" data-m="chat" aria-selected="true"><i data-icon="message" data-size="16"></i>Chat</button>
  <button type="button" role="tab" data-m="site" aria-selected="false"><i data-icon="monitor" data-size="16"></i>Site<span class="m-dot" hidden></span></button>
  <span class="m-progress" id="mProgress" aria-hidden="true"></span>
</nav>

<section class="chat">
  <div class="bar">
    <a class="logo" href="/" title="Home"><span class="mark"><i data-icon="logo" data-size="18"></i></span></a>
    <div class="title">
      <div class="name" id="pname" title="Edit name and description" role="button" tabindex="0">…</div>
      <div class="sub"><button class="desc" id="pdesc" title="Edit name and description"></button>
        <span aria-hidden="true">·</span><button class="pid mono" id="pid" title="Copy project id"></button></div>
    </div>
    <span class="conn" id="conn" title="Connecting…"></span>
    <a class="icon-btn" href="/projects" title="All projects" aria-label="All projects"><i data-icon="grid" data-size="17"></i></a>
  </div>

  <div class="messages" id="messages"></div>

  <form class="composer" id="composer">
    <div class="attachments" id="attachments" hidden></div>
    <div class="box">
      <textarea class="input" id="input" rows="1" maxlength="10000" placeholder="Describe what to build…" aria-label="Prompt"></textarea>
      <div class="row">
        <button type="button" class="icon-btn plain attach" id="attach" title="Attach reference images (or paste / drop them)" aria-label="Attach images"><i data-icon="paperclip" data-size="17"></i></button>
        <input type="file" id="fileInput" accept="image/png,image/jpeg,image/webp,image/gif" multiple hidden>
        <span class="hint"><kbd>Enter</kbd> send · <kbd>Shift</kbd>+<kbd>Enter</kbd> new line</span>
        <span class="spacer"></span>
        <span class="team-hint" id="teamHint"></span>
        <button class="send" id="send" type="submit" title="Send" aria-label="Send"></button>
      </div>
    </div>
  </form>
</section>

<section class="stage">
  <div class="toolbar">
    <div class="seg" id="tabs" role="tablist">
      <button role="tab" data-tab="preview" class="on" aria-selected="true"><i data-icon="eye" data-size="16"></i><span class="lbl">Preview</span></button>
      <button role="tab" data-tab="code"><i data-icon="code" data-size="16"></i><span class="lbl">Code</span></button>
      <button role="tab" data-tab="project" title="Contact details, images, QR codes, brand kit and brief"><i data-icon="briefcase" data-size="16"></i><span class="lbl">Project</span></button>
      <button role="tab" data-tab="research" title="The Research agent's report"><i data-icon="search" data-size="16"></i><span class="lbl">Research</span></button>
      <button role="tab" data-tab="versions" title="Every saved version of the code: open, compare, restore"><i data-icon="history" data-size="16"></i><span class="lbl">Versions</span></button>
      <button role="tab" data-tab="stats" title="Cost and time per agent in this project"><i data-icon="chart" data-size="16"></i><span class="lbl">Stats</span></button>
      <button role="tab" data-tab="share" title="Share links, comments from the people you shared with, and who works on this project"><i data-icon="share" data-size="16"></i><span class="lbl">Share</span><span class="badge" id="shareBadge" hidden></span></button>
    </div>
    <span class="spacer"></span>
    <a class="btn btn-ghost btn-sm" id="download" title="Download the code as .zip" aria-label="Download the code as .zip"><i data-icon="download" data-size="16"></i><span class="lbl">.zip</span></a>
  </div>

  <div class="pv-bar" id="pvTools">
    <div class="seg" id="devices">
      <button data-device="desktop" class="on" title="Desktop" aria-label="Desktop" aria-pressed="true"><i data-icon="monitor" data-size="16"></i></button>
      <button data-device="tablet" title="Tablet · 768px" aria-label="Tablet · 768px" aria-pressed="false"><i data-icon="tablet" data-size="16"></i></button>
      <button data-device="phone" title="Phone · 375px" aria-label="Phone · 375px" aria-pressed="false"><i data-icon="phone" data-size="16"></i></button>
    </div>
    <label class="page-pick" title="Page shown in the preview"><i data-icon="file" data-size="15"></i>
      <select id="pageSel" aria-label="Page shown in the preview"></select></label>

    <button class="icon-btn" id="open" title="Open in a new tab" aria-label="Open in a new tab"><i data-icon="external" data-size="16"></i></button>
  </div>

  <div class="view">
    <div class="placeholder" id="placeholder"><div class="box">
      <div class="tile"><i data-icon="monitor" data-size="24"></i></div>
      <b>Nothing to preview yet</b>
      The page appears here as soon as the HTML agent writes <span class="mono">index.html</span>.
    </div></div>
    <div class="frame-wrap" id="frameWrap"><iframe id="frame" title="Live preview" sandbox="allow-scripts allow-forms allow-popups allow-modals allow-top-navigation-to-custom-protocols allow-popups-to-escape-sandbox"></iframe></div>
    <div class="flash" id="flash"></div>
    <div class="code" id="code">
      <nav class="files" id="files"></nav>
      <div class="codepane">
        <div class="codehead">
          <i data-icon="file" data-size="14"></i><span id="codeName"></span><span class="dirty-dot" id="dirtyDot" hidden title="Unsaved changes"></span>
          <span class="save-state" id="saveState"></span><span class="spacer"></span>
          <label class="autosave" title="Save automatically a moment after you stop typing"><span>Auto-save</span><input type="checkbox" id="autosave"></label>
          <button class="btn btn-dark btn-sm" id="saveFile" title="Save (Ctrl+S)"><i data-icon="save" data-size="14"></i>Save</button>
          <button class="icon-btn plain" id="copyCode" title="Copy file" aria-label="Copy file"><i data-icon="copy" data-size="16"></i></button></div>
        <textarea class="editor" id="source" spellcheck="false" autocapitalize="off" autocomplete="off" wrap="off" aria-label="File contents"></textarea>
        <div class="file-note" id="fileNote" hidden></div>

    <div class="research" id="research" role="region" aria-label="Research report" aria-live="polite"></div>
    <div class="pane" id="versions" role="region" aria-label="Versions"><div class="pane-in">
      <div class="pane-head"><h2>Versions</h2><span class="meta">Saved before every run and after each agent</span>
        <div class="acts"><button class="btn btn-dark btn-sm" id="saveVersion"><i data-icon="save" data-size="14"></i>Save version now</button></div></div>
      <div id="versionsBody"></div></div></div>
    <div class="pane" id="stats" role="region" aria-label="Stats"><div class="pane-in">
      <div class="pane-head"><h2>Cost &amp; time</h2><span class="meta">Every agent run in this project</span></div>
      <div id="statsBody"></div></div></div>

  <section class="team" id="team" aria-label="Agent team">
