<script>
const $ = (id) => document.getElementById(id);
const TOOL_ICON = { Read: "eye", Write: "file-plus", Edit: "pencil", Glob: "folder", Grep: "search", WebSearch: "search", WebFetch: "external" };
const TOOL_VERB = { Read: "Reading", Write: "Writing", Edit: "Editing", Glob: "Looking in", Grep: "Searching", WebSearch: "Searching the web for", WebFetch: "Reading" };
// Use cases shown first for an imported site; a new project shows the "build" ones first.
const IMPORT_FIRST = ["improve-imported", "redesign", "multilingual", "boost-conversions", "seo-speed", "accessibility-audit"];
let showAllUseCases = false;
const MAX_ACTIONS = 4;

let AGENTS = [], BY_ID = {}, PID = null, project = null, selected = new Set();
let canRate = false, myRatings = {};   // the project's owner rates each agent that worked on it
let myRole = "owner", canEdit = true;  // owner · admin · editor · viewer (see collab.py); viewers only watch
let busy = false, ws, lastSeq = 0, replaying = false;
let currentFile = "index.html", changed = new Set(), cards = {};
let run = null;   // { agents: [...ids], index, started }
const status = {}; // agent id -> { state: waiting|working|done|stopped, started, ended, last }
let collapsed = false, lastPrompt = "";
let paused = null;  // saved run that was stopped / failed / interrupted: { agents, done, current, next, request, status, resumable }
// Folded by default on small screens, where the open strip would cover the preview and the other tabs; a saved choice wins.
try { const saved = localStorage.getItem("teamCollapsed"); collapsed = saved === null ? matchMedia("(max-width: 900px)").matches : saved === "1"; }
catch { collapsed = matchMedia("(max-width: 900px)").matches; }

// ================================================================ boot
function fatal(err, title = "The studio couldn't open this project") {
  document.querySelector(".fatal")?.remove();
  document.body.insertAdjacentHTML("beforeend", `<div class="fatal"><div class="err-state" role="alert" style="max-width:480px">
    <span class="tile">${icon("alert", { size: 22 })}</span><b>${esc(title)}</b><p>${esc(err?.message || String(err))}</p>
    <div class="row"><button class="btn btn-dark btn-sm" onclick="location.reload()">${icon("refresh", { size: 14 })}Try again</button>
    <a class="btn btn-ghost btn-sm" href="/projects">Your projects</a></div></div></div>`);
}

async function boot() {
  const m = location.pathname.match(/^\/p\/([0-9a-f-]{36})$/i);
  if (!m) return location.replace("/projects");
  PID = m[1];
  try {
    [AGENTS, project] = await Promise.all([api(`/api/agents?project=${PID}`), api(`/api/projects/${PID}`)]);
  } catch (err) {
    if (err.status === 404) { toast("That project doesn't exist any more", "err"); return setTimeout(() => location.replace("/projects"), 900); }
    return fatal(err);
  }
  AGENTS.forEach(a => BY_ID[a.id] = a);
  await loadPresets();
  const me = await getMe().catch(() => null);
  canRate = !!me && project.owner === me.id;
  myRole = project.my_role || "owner";
  canEdit = ["owner", "admin", "editor"].includes(myRole);
  if (!canEdit) document.body.classList.add("viewer");
  if (myRole === "editor" || myRole === "viewer") $("pname").insertAdjacentHTML("afterend", `<span class="role-tag" title="${myRole === "editor"
    ? "You work on this project with its owner. The agents run on the owner's Claude account."
    : "You can watch this project: the chat, the preview, the code and the comments. You can't change it."}">${myRole === "editor" ? "Editor" : "Viewer"}</span>`);
  refreshShareBadge();
  if (canRate) myRatings = await api(`/api/projects/${PID}/ratings`).catch(() => ({}));

  selected = new Set(project.agents.filter(id => BY_ID[id]));
  lockRequired();
  renderHeader(); renderTeam(); setBusy(false);
  renderPages();
  $("download").href = `/api/projects/${PID}/download`;
  try {
    const note = sessionStorage.getItem("atelier-import-note");
    if (note) { sessionStorage.removeItem("atelier-import-note"); toast(note); }
  } catch {}

  replaying = true; $("messages").classList.add("replay");
  (project.events || []).forEach(safeHandle);
  replaying = false; $("messages").classList.remove("replay");
  if (!project.events.length) showEmpty();
  {
    // Handed over by another page: "New project with this team", the project form, or "Start a job" in the
    // marketplace (atelier-start-for names the project it's meant for; it may already have a history).
    const take = (k) => { try { const v = sessionStorage.getItem(k); sessionStorage.removeItem(k); return v; } catch { return null; } };
    take("atelier-job-for");
    const start = take("atelier-start-team"), startFor = take("atelier-start-for"), startPrompt = take("atelier-start-prompt");
    let startAgents = null, addAgents = null;
    try { startAgents = JSON.parse(take("atelier-start-agents") || "null"); addAgents = JSON.parse(take("atelier-start-add") || "null"); } catch {}
    const forThis = startFor ? startFor === PID : !project.events.length;
    if (forThis && (start || startAgents || addAgents || startPrompt)) {
      if (project.busy) toast("Agents are working. Change the team when they finish", "err");
      else {
        if (start) useTeam(presets.find(p => p.id === start), { fillPrompt: !startPrompt && !project.events.length });
        if (Array.isArray(startAgents) && startAgents.length) {
          selected = new Set(startAgents.filter(id => BY_ID[id]));
          lockRequired(); saveSelection(); renderTeam();
        }
        if (Array.isArray(addAgents)) {
          const added = addAgents.filter(id => BY_ID[id]);
          added.forEach(id => selected.add(id));
          lockRequired(); saveSelection(); renderTeam();
          if (added.length) toast(`${BY_ID[added[0]].name} joined this project's team. Describe the job, then press Enter`);
          $("input").focus();
        }
        if (startPrompt) { $("input").value = startPrompt; autosize(); $("input").focus(); toast("Your job is ready: check the prompt, then press Enter"); }
      }
    }
  }
  if (!project.busy) {
    run = null; markStopped();
    paused = project.run?.resumable ? project.run : null;
    if (paused) {
      restoreStatuses(paused);
      // a run cut off by a server restart has no "stopped" event in the chat: add its card now
      if (!document.querySelector(".resume-card:not(.used)")) addResumeCard(paused);
    } else disableResumeCards();
    renderTeam();
  }
  foldHistory();
  scrollDown();

  const tab = restoreState();
  reloadPreview();
  refreshPages();
  if (tab) showTab(tab);
  addEventListener("hashchange", () => { if (PANES[location.hash.slice(1)] || location.hash === "#preview") showTab(location.hash.slice(1)); });
  connect();
  setInterval(tick, 1000);
  if (needsDetails()) editDetails({ required: true });
}

function renderHeader() {
  $("pname").textContent = project.name;
  const missing = !project.description;
  $("pdesc").textContent = missing ? "Add a description" : project.description;
  $("pdesc").classList.toggle("missing", missing);
  $("pdesc").title = missing ? "Every project needs a description" : project.description;
  $("pid").innerHTML = `${icon("copy", { size: 12 })}#${PID.slice(0, 8)}`;
  $("pid").title = "Copy project id: " + PID;
  document.title = `${project.name} · Agents Atelier`;
}

let wsFails = 0, wasConnected = false, reconnectTimer, bannerTimer;
function connect() {
  clearTimeout(reconnectTimer);
  if (ws && ws.readyState <= 1) { ws.onclose = null; try { ws.close(); } catch {} }   // "Retry now" while a try is pending
  try { ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws/${PID}`); }
  catch { reconnectTimer = setTimeout(connect, 3000); return; }
  ws.onopen = () => {
    $("conn").classList.add("on"); $("conn").title = "Connected";
    wsFails = 0; clearTimeout(bannerTimer); $("connBanner")?.remove();
    if (wasConnected) { resync(); toast("Reconnected to the server"); }
    wasConnected = true;
  };
  ws.onclose = (e) => {
    $("conn").classList.remove("on"); $("conn").title = "Reconnecting…";
    if (e.code === 4401) return location.replace(`/login?next=${encodeURIComponent(location.pathname)}`);
    if (e.code === 4404) { toast("This project was deleted", "err"); return setTimeout(() => location.replace("/projects"), 900); }
    if (e.code === 4403) { $("conn").title = "Refused"; return fatal(new Error("The server refused this connection. Open the studio from http://localhost (not another address)."), "Connection refused"); }
    wsFails++;
    if (!$("connBanner")) { clearTimeout(bannerTimer); bannerTimer = setTimeout(showConnBanner, 2000); }
    reconnectTimer = setTimeout(connect, Math.min(1500 * wsFails, 10000));
  };
  ws.onmessage = (e) => {
    let ev;
    try { ev = JSON.parse(e.data); } catch { return console.warn("Ignored a message the studio couldn't read", e.data); }
    safeHandle(ev);
  };
}
function showConnBanner() {
  if (ws?.readyState === 1) return;
  const text = navigator.onLine === false
    ? "You're offline. The studio reconnects when you're back online. Agents keep working on the server."
    : "Lost the connection to the server. Reconnecting… Agents keep working on the server.";
  if ($("connBanner")) { $("connBanner").querySelector("span:not(.spacer)").textContent = text; return; }
  $("messages").insertAdjacentHTML("beforebegin", `<div class="conn-banner" id="connBanner" role="status">${icon("alert", { size: 16 })}
    <span>${esc(text)}</span><span class="spacer"></span>
    <button class="btn btn-ghost btn-sm" type="button" id="reconnectNow">Retry now</button></div>`);
  $("reconnectNow").onclick = () => { wsFails = 0; connect(); };
}
/* Back online: reconnect now instead of waiting for the next try. Offline: say so in the banner. */
addEventListener("online", () => { if (PID && ws?.readyState !== 1 && ws?.readyState !== 0) { wsFails = 0; connect(); } });
addEventListener("offline", () => { if ($("connBanner")) showConnBanner(); });
/* After a reconnect: show what happened while we were away (events are numbered, duplicates are skipped). */
async function resync() {
  try {
    const p = await api(`/api/projects/${PID}`);
    (p.events || []).forEach(safeHandle);
    if (!p.busy && busy) {
      setBusy(false); run = null; markStopped();
      paused = p.run?.resumable ? p.run : null;
      renderTeam();
    }
    reloadPreview();
  } catch (err) { console.warn("Resync failed", err); }
}
function wsSend(msg) {
  if (ws?.readyState !== 1) { toast("Not connected to the server. Reconnecting…", "err"); return false; }
  ws.send(JSON.stringify(msg));
  return true;
}

// ================================================================ events
/* One bad event (old format, damaged chat line…) must never stop the studio from opening or updating. */
let badEvents = 0;
function safeHandle(ev) {
  try { if (ev && typeof ev === "object") handle(ev); }
  catch (err) {
    console.error("Couldn't show an event", ev, err);
    if (!badEvents++) toast("Part of this project's history couldn't be shown (details in the browser console)", "err");
  }
}
function handle(ev) {
  if (ev.seq !== undefined) {
    if (ev.type !== "file_changed" && ev.seq <= lastSeq) return;
    lastSeq = Math.max(lastSeq, ev.seq);
  }
  const a = BY_ID[ev.agent] || (ev.agent ? { id: ev.agent, name: ev.agent, icon: "bot", color: "#766a7c" } : null);
  const now = ev.ts ? ev.ts * 1000 : Date.now();
  switch (ev.type) {
    case "hello": setBusy(ev.busy); break;
    case "orchestrating":
      setBusy(true);
      orchCard = addMsg(`<div class="msg orch working" role="status"><div class="head"><span class="tile">${icon("cpu", { size: 18 })}</span>
        <span><b>Orchestrator:</b> reading your request and the project</span>
        <span class="state"><span class="typing"><span></span><span></span><span></span></span></span></div>
        <p class="why"></p></div>`);
      renderTeamHead();
      break;
    case "plan": showPlan(ev); break;
    case "needs_key":                     // the agents run on the owner's own Claude account, and there's no key yet
      setBusy(false);
      if (lastPrompt && !$("input").value) { $("input").value = lastPrompt; autosize(); }
      document.querySelectorAll(".msg.keycard").forEach(x => x.remove());
      addMsg(`<div class="msg keycard" role="alert"><span class="tile">${icon("lock", { size: 18 })}</span>
        <div><b>${ev.mine ? "Add your Claude API key" : "This project's owner needs a Claude API key"}</b><p>${esc(ev.text)}</p>
        ${ev.mine ? `<a class="btn btn-dark btn-sm" href="/profile#claude-key">${icon("arrow-right", { size: 14 })}Add my API key</a>` : ""}</div></div>`);
      break;
    case "notice":
      if (ev.upgrade) addMsg(`<div class="msg system">${esc(ev.text)} <a href="/profile?upgrade=${encodeURIComponent(ev.upgrade)}#plan">See the plans</a></div>`);
      else addSystem(ev.text);
      break;
    case "limit":                         // the run reached the member's spending limit: run_stopped follows
      addMsg(`<div class="msg limitcard"><span class="tile">${icon("pause", { size: 18 })}</span>
        <div><b>Spending limit reached</b><p>${esc(ev.text)}</p>
        <a class="lnk" href="/profile#plan">Change the limit</a></div></div>`);
      break;
    case "needs_details":
      if (lastPrompt && !$("input").value) { $("input").value = lastPrompt; autosize(); }
      editDetails({ required: true, note: ev.text });
      break;
    case "user":
      if (!replaying) pendingPrompt = null;   // the server took it
      closeAsks(ev.answers ? "Answered" : "You sent a new message instead");
      foldPastCards();
      addMsg(`<div class="msg user">${(ev.images || []).length ? `<div class="imgs">${ev.images.map(i =>
        `<a href="${esc(mediaUrl(i))}" target="_blank" rel="noopener"><img src="${esc(mediaUrl(i))}" loading="lazy" decoding="async" alt="Reference image"></a>`).join("")}</div>` : ""}${
        ev.answers ? `<dl class="qa">${ev.answers.map(p => `<dt>${esc(p.question)}</dt><dd>${esc(p.answer)}</dd>`).join("")}</dl>` : esc(ev.text)}</div>`);
      break;
    case "answer":
      closeAsks(ev.action === "confirm" ? "Confirmed: the team is starting" : "Cancelled: nothing ran");
      if (ev.action === "confirm") setBusy(true);
      break;
    case "run_start":
      setBusy(true);
      if (ev.retry) {
        const ra = BY_ID[ev.agents[0]];
        run = { agents: AGENTS.filter(x => selected.has(x.id) || x.id === ev.agents[0]).map(x => x.id), index: -1, started: now, retry: ev.agents[0] };
        status[ev.agents[0]] = { state: "waiting" };
        addSystem(`Retrying ${ra?.name || ev.agents[0]}${ev.note ? `: “${ev.note}”` : ""}`);
        renderTeam();
        break;
      }
      // `pool` = the agents switched on (the Orchestrator may pick fewer); older runs only sent `agents`
      if (ev.pool?.length) selected = new Set(ev.pool.filter(id => BY_ID[id]));
      else if (ev.agents) selected = new Set(ev.agents.filter(id => BY_ID[id]));
      lockRequired();
      run = { agents: ev.agents || [...selected], index: -1, started: now };
      paused = null; disableResumeCards();
      Object.keys(status).forEach(k => { if (!(ev.done || []).includes(k)) delete status[k]; });
      run.agents.forEach(id => { if (!(ev.done || []).includes(id)) status[id] = { state: "waiting" }; else status[id] = { ...(status[id] || {}), state: "done" }; });
      selected.forEach(id => { if (!run.agents.includes(id)) status[id] = { state: "skipped" }; });
      if (ev.name && project && ev.name !== project.name) { project.name = ev.name; renderHeader(); }
      renderTeam();
      break;
    case "agent_start":
      if (!a) break;
      if (run) run.index = ev.with?.length ? Math.min(...[a.id, ...ev.with].map(id => run.agents.indexOf(id)).filter(n => n >= 0)) : run.agents.indexOf(a.id);
      status[a.id] = { state: "working", started: now, last: "" };
      cards[a.id] = addAgentCard(a, now, run ? run.index + 1 : 0, run ? run.agents.length : 0, !!ev.fix, ev.with || []);
      renderTeam();
      break;
    case "parallel":                      // agents the Orchestrator lets work at the same time
      addMsg(`<div class="msg system par">${icon("split", { size: 14 })}<span>${esc(agentNames(ev.agents))} work at the same time</span></div>`);
      break;
    case "schedule":                      // a first build: the Orchestrator's groups arrived while Brief worked
      addMsg(`<div class="msg system par">${icon("split", { size: 14 })}<span>Side by side in this build: ${(ev.groups || []).map(g => esc(agentNames(g))).join(" · ")}</span></div>`);
      break;
    case "comment":                       // a pinned comment from a share link, or one resolved / deleted by the team
      shareChanged(ev);
      break;
    case "people":
      if (tabOn("share")) loadShare();
      break;
    case "tool":
      addAction(ev.agent, ev.tool, ev.target);
      if (status[ev.agent]) { status[ev.agent].last = `${TOOL_VERB[ev.tool] || ev.tool} ${ev.target}`; renderTile(ev.agent); }
      break;
    case "agent_text": setCardText(ev.agent, ev.text); break;
    case "file_changed":
      changed.add(ev.file);
      if (!replaying && onPhone() && document.body.dataset.m === "chat") $("mSwitch").querySelector(".m-dot").hidden = false;   // the site changed
      if (/\.html?$/i.test(ev.file || "") && !replaying) refreshPagesSoon();
      if (a) flash(a.color);
      reloadPreview(); refreshCode();
      if (ev.file === "research.md") refreshResearch();
      break;
    case "agent_done":
      if (!a) break;
      status[a.id] = { ...(status[a.id] || {}), state: "done", ended: now };
      finishCard(a.id, ev.text, now, ev.stat);
      if (!replaying && tabOn("stats")) loadStats();
      if (!replaying && ev.version && tabOn("versions")) loadVersions();
      renderTeam();
      break;
    case "run_done": {
      if (!replaying && tabOn("project")) syncProject().then(renderProject);
      if (ev.retry) {
        setBusy(false); const r = run?.retry; run = null; renderTeam();
        addSystem(`${BY_ID[r]?.name || "Agent"} finished its retry`);
        if (!replaying) toast("Retry finished");
        break;
      }
      const took = run ? ` in ${duration((now - run.started) / 1000)}` : "";
      setBusy(false); run = null; renderTeam();
      addMsg(`<div class="msg done-card">
        <span class="lbl"><span class="tile">${icon("check", { size: 16 })}</span>Team finished${took}</span>
        ${canEdit ? `<button class="btn btn-ghost btn-sm" type="button" data-goto-share title="Send a preview link and collect comments on the page">${icon("share", { size: 14 })}Share for feedback</button>` : ""}
        ${canRate ? `<label class="showcase"><input type="checkbox" data-showcase ${project.showcase ? "checked" : ""}>
          <span>Show this site in the portfolios of the agents that built it</span></label>` : ""}</div>`);
      if (!replaying) toast("The team finished the page");
      break;
    }
    case "run_stopped":
      setBusy(false); run = null; markStopped();
      if (ev.orchestrator) { addSystem("Stopped before the team started"); renderTeam(); break; }
      if (ev.retry) { addSystem("Retry stopped"); paused = ev.run?.resumable ? ev.run : paused; renderTeam(); break; }
      paused = ev.run?.resumable ? ev.run : null;
      if (paused) addResumeCard(paused); else addSystem("Stopped");
      renderTeam();
      break;
    case "error": {
      // A numbered error is part of the run's story (it failed). One without a number answers only this tab
      // (too many runs, a viewer can't run agents, agents already working…): whatever is running carries on.
      const direct = ev.seq === undefined;
      if (!direct) { setBusy(false); run = null; markStopped(); }
      document.querySelectorAll(".msg.orch.asking [aria-busy]").forEach(b => {   // the answer didn't go through: let them try again
        b.removeAttribute("aria-busy");
        b.closest(".ask").querySelectorAll("button").forEach(x => x.disabled = false);
      });
      if (!replaying) restorePrompt();          // a refused prompt goes back in the box, with its images
      if (ev.viewer && !replaying) {           // the owner made this person a viewer while the studio was open
        canEdit = false; myRole = "viewer"; document.body.classList.add("viewer"); updateSend();
      }
      const ic = ev.rate_limited ? "clock" : ev.viewer ? "eye" : "alert";
      addMsg(`<div class="msg error" ${replaying ? "" : 'role="alert"'}>${icon(ic, { size: 16 })}<span>${esc(ev.text)}</span></div>`);
      if (!direct) {
        paused = ev.run?.resumable ? ev.run : paused;
        if (ev.run?.resumable) addResumeCard(ev.run);
      }
      renderTeam();
      break;
    }
    case "browser_check_start": break;
    case "browser_check": {
      const shots = (ev.screenshots || []).map(f => `<a href="${mediaUrl(f)}" target="_blank" rel="noopener"><img loading="lazy" src="${mediaUrl(f)}?v=${Date.now()}" alt="${esc(f.includes("phone") ? "Phone screenshot" : "Desktop screenshot")}"></a>`).join("");
      addMsg(`<div class="msg bcheck ${ev.problems ? "warn" : ""}"><div class="head">${icon(ev.problems ? "alert" : "check", { size: 16 })}<span>${esc(ev.text)}</span></div>${shots ? `<div class="shots">${shots}</div>` : ""}</div>`);
      break;
    }
    case "security":
      addMsg(`<div class="msg security" role="alert"><div class="head">${icon("alert", { size: 18 })}<span><b>Security check:</b> ${esc(ev.text)}</span></div>
        ${(ev.items || []).length ? `<ul>${ev.items.map(i => `<li>${esc(i)}</li>`).join("")}</ul>` : ""}
        <p>Blocked actions never ran. Review the files (Code tab), or restore an earlier version if something looks wrong.</p></div>`);
      if (!replaying) toast("Security check: see the warning in the chat", "err");
      break;
    case "send_back": {
      const items = ev.items || [];
      if (run) {
        items.forEach(i => { status[i.agent] = { state: "waiting" }; });
        status[ev.agent] = { state: "waiting" };
      }
      addMsg(`<div class="msg sendback"><div class="head">${icon("refresh", { size: 18 })}<span><b>${esc(a?.name || "Critic")} sent work back</b>, round ${ev.round} of ${ev.rounds}. ${items.length === 1 ? "This agent fixes" : "These agents fix"} it, then ${esc(a?.name || "the Critic")} checks again.</span></div>
        <ul>${items.map(i => { const t = BY_ID[i.agent] || { name: i.agent, icon: "bot", color: "#766a7c" };
          return `<li><span class="who" style="color:${esc(t.color)}">${icon(t.icon, { size: 16 })}<span style="color:var(--ink)">${esc(t.name)}</span></span><span>${esc(i.note)}</span></li>`; }).join("")}</ul></div>`);
      renderTeam();
      break;
    }
    case "versions": if (tabOn("versions")) loadVersions(); break;
    case "pages":
      project.pages = ev.pages;
      refreshPagesSoon();
      if (!replaying) toast("A new page was added to the site");
      break;
    case "restored":
      if (!replaying) { reloadPreview(); refreshCode(true); if (tabOn("versions")) loadVersions(); toast(`Restored version ${ev.version}`); }
      addSystem(`Restored version ${ev.version}${ev.backup ? ` (the code before was saved as v${ev.backup})` : ""}`);
      break;
    case "resume": {
      const from = BY_ID[ev.from]?.name || "the next agent";
      addSystem(ev.mode === "continue" ? `Continuing from ${from}…` : `Starting again from ${from}…`);
      break;
    }
  }
}

// ================================================================ chat
function showEmpty() {
  const team = AGENTS.filter(a => selected.has(a.id));
  $("messages").innerHTML = `<div class="empty" id="empty">
    <div class="stack">${team.slice(0, 7).map(a => `<span title="${esc(a.name)}">${icon(a.icon, { size: 16 })}</span>`).join("")}</div>
    <h3>${project.imported ? "What should the team change?" : "What should the team build?"}</h3>
    ${project.imported
      ? `Your site was imported (${project.imported.files} file${project.imported.files === 1 ? "" : "s"}). Describe what to improve and ${team.length} agent${team.length === 1 ? "" : "s"} will work on it, one after another.`
      : `Describe a page and ${team.length} agent${team.length === 1 ? "" : "s"} will build it, one after another.`}
    ${useCasesHTML()}
  </div>`;
}
function useCasesHTML() {
  let cases = presets.filter(p => p.prompt);
  if (!cases.length) return "";
  if (project.imported) cases = [...cases].sort((a, b) => (IMPORT_FIRST.indexOf(b.id) > -1) - (IMPORT_FIRST.indexOf(a.id) > -1)
    || IMPORT_FIRST.indexOf(a.id) - IMPORT_FIRST.indexOf(b.id));
  const shown = showAllUseCases ? cases : cases.slice(0, 6);
  return `<p class="uc-title">Start from a use case</p>
    <div class="usecases">${shown.map(p => `<button class="uc" type="button" data-usecase="${esc(p.id)}">
      <b>${esc(p.name)}</b><small>${esc(p.description || "")}</small><span>${icon("users", { size: 12 })}${p.agents.length} agents</span></button>`).join("")}</div>
    ${cases.length > 6 ? `<button class="uc-more" type="button" data-usecases-more>${showAllUseCases ? "Show fewer" : `Show all ${cases.length} use cases`}</button>` : ""}`;
}
/* Pick a team; its starting prompt goes in the box when the box is empty (or when asked), with the first [part] selected. */
function useTeam(p, { fillPrompt = false } = {}) {
  if (!p || busy) return;
  selected = new Set(p.agents.filter(id => BY_ID[id]));
  lockRequired();
  saveSelection();
  const box = $("input");
  if (p.prompt && (fillPrompt || !box.value.trim())) {
    const text = p.prompt.split("\n").map(line => t(line)).join("\n");   // in French when the interface is
    box.value = text;
    autosize();
    box.focus();
    const at = text.indexOf("[");
    if (at > -1) box.setSelectionRange(at, text.indexOf("]", at) + 1 || at);
    toast(`Using the “${p.name}” team. Replace the parts in [brackets].`);
  } else toast(`Using the “${p.name}” team`);
}
$("messages").addEventListener("click", (e) => {
  const uc = e.target.closest("[data-usecase]");
  if (uc) useTeam(presets.find(p => p.id === uc.dataset.usecase), { fillPrompt: true });
  if (e.target.closest("[data-usecases-more]")) { showAllUseCases = !showAllUseCases; showEmpty(); }
  const more = e.target.closest(".more");
  if (more) { const box = more.parentElement; box.classList.toggle("open"); updateMore(box); }
});

function addMsg(html) {
  $("empty")?.remove();
  $("messages").insertAdjacentHTML("beforeend", html);
  if (!replaying) scrollDown();
  return $("messages").lastElementChild;
}
const scrollDown = () => {
  const m = $("messages");
  if ($("empty")) { m.scrollTop = 0; return; }   // a new project starts at the top of its welcome, not under the use cases
  m.scrollTop = m.scrollHeight;
};
const addSystem = (t) => addMsg(`<div class="msg system">${esc(t)}</div>`);

const agentNames = (ids) => {
  const names = (ids || []).map(id => BY_ID[id]?.name || id);
  return names.length > 1 ? `${names.slice(0, -1).join(", ")} and ${names[names.length - 1]}` : names[0] || "";
};
function addAgentCard(a, started, step, total, fix = false, alongside = []) {
  const el = addMsg(`<div class="msg agent working ${alongside.length ? "par" : ""}" data-agent="${esc(a.id)}" style="--c:${a.color}">
    <div class="who"><span class="tile">${icon(a.icon, { size: 18 })}</span>
      <span class="nm" title="${esc(a.description || "")}">${esc(a.name)} agent${fix ? `<small>Fixing the Critic's feedback</small>` : step ? `<small>Step ${step} of ${total}${alongside.length ? ` · alongside ${esc(agentNames(alongside))}` : ""}</small>` : ""}</span>
      <span class="state"><span class="timer">0s</span><span class="typing"><span></span><span></span><span></span></span></span>
      <button class="icon-btn plain retry" data-retry="${esc(a.id)}" title="Retry ${esc(a.name)}: run only this agent again">${icon("refresh", { size: 15 })}</button></div>
    <div class="actions"></div><div class="text"></div></div>`);
  el.dataset.started = started;
  return el;
}
function addAction(id, tool, target) {
  const card = cards[id]; if (!card) return;
  const box = card.querySelector(".actions");
  box.querySelector(".more")?.remove();
  box.insertAdjacentHTML("beforeend",
    `<div class="action">${icon(TOOL_ICON[tool] || "file", { size: 13 })}${TOOL_VERB[tool] || tool} <b>${esc(target)}</b></div>`);
  updateMore(box);
  if (!replaying) scrollDown();
}
function updateMore(box) {
  const items = [...box.querySelectorAll(".action")];
  items.forEach((el, i) => el.classList.toggle("hidden", i < items.length - MAX_ACTIONS));
  box.querySelector(".more")?.remove();
  const hidden = items.length - MAX_ACTIONS;
  if (hidden > 0) box.insertAdjacentHTML("afterbegin",
    `<button class="more" type="button">${box.classList.contains("open") ? "Show less" : `Show ${hidden} earlier step${hidden > 1 ? "s" : ""}`}</button>`);
}
function setCardText(id, text) {
  const card = cards[id]; if (!card) return;
  card.querySelector(".text").textContent = text || "";
  if (!replaying) scrollDown();
}
function finishCard(id, text, ended, stat) {
  const card = cards[id]; if (!card) return;
  setCardText(id, text);
  card.classList.remove("working");
  const took = card.dataset.started && ended ? ` · ${duration((ended - card.dataset.started) / 1000)}` : "";
  const cost = stat?.cost ? ` · <span class="cost" title="Estimated API cost">${money(stat.cost)}</span>` : "";
  card.querySelector(".state").innerHTML = `${icon("check", { size: 14 })}Done${took}${cost}`;
  if (stat?.model) card.querySelector(".nm small")?.insertAdjacentHTML("beforeend", ` · ${esc(stat.model.replace(/^claude-/, ""))}`);
  addRateRow(card, id);
}

$("messages").addEventListener("click", (e) => { if (e.target.closest("[data-goto-share]")) { shareSec = "links"; showTab("share"); } });
$("messages").addEventListener("change", async (e) => {
  const box = e.target.closest("[data-showcase]"); if (!box) return;
  try {
    project = { ...project, ...(await api(`/api/projects/${PID}`, { method: "PATCH", body: JSON.stringify({ showcase: box.checked }) })) };

  } catch (err) { box.checked = !box.checked; toast(err.message, "err"); }
});

/* ---------- ratings: a thumbs up or down for each agent's work on this project (the owner only) ---------- */
function rateRowHTML(id) {
  const r = myRatings[id] || { value: 0, comment: "" };
  return `${r.value ? (r.value > 0 ? "You liked this agent's work" : "You didn't like this agent's work") : "Rate this agent's work"}
    <button class="icon-btn plain ${r.value > 0 ? "on" : ""}" type="button" data-rate="1" aria-pressed="${r.value > 0}" title="Good work" aria-label="Good work">${icon("thumbs-up", { size: 15 })}</button>
    <button class="icon-btn plain ${r.value < 0 ? "on bad" : ""}" type="button" data-rate="-1" aria-pressed="${r.value < 0}" title="Not good" aria-label="Not good">${icon("thumbs-down", { size: 15 })}</button>
    ${r.value ? `<button class="link" type="button" data-rate-comment>${r.comment ? "Edit comment" : "Add a comment"}</button>` : ""}
    ${r.comment ? `<span class="said" data-no-i18n>“${esc(r.comment)}”</span>` : ""}`;
}
function addRateRow(card, id) {
  if (!canRate || !BY_ID[id] || card.querySelector(".rate")) return;
  card.insertAdjacentHTML("beforeend", `<div class="rate" data-rate-agent="${esc(id)}">${rateRowHTML(id)}</div>`);
}
const refreshRateRows = (id) => document.querySelectorAll(`.rate[data-rate-agent="${CSS.escape(id)}"]`).forEach(el => { el.innerHTML = rateRowHTML(id); });
async function saveRating(id, value, comment) {
  try {
    const r = await api(`/api/projects/${PID}/ratings`, { method: "PUT", body: JSON.stringify({ agent: id, value, comment }) });
    myRatings[id] = r.value ? { value: r.value, comment: r.comment } : undefined;
    refreshRateRows(id);
  } catch (err) { toast(err.message, "err"); }
}
$("messages").addEventListener("click", async (e) => {
  const row = e.target.closest(".rate"); if (!row) return;
  const id = row.dataset.rateAgent, cur = myRatings[id] || { value: 0, comment: "" };
  const b = e.target.closest("[data-rate]");
  if (b) {
    const v = +b.dataset.rate;
    await saveRating(id, cur.value === v ? 0 : v, cur.value === v ? "" : cur.comment);
    if (myRatings[id] && !cur.value) toast(`Thanks: your rating shows on ${BY_ID[id]?.name || "the agent"}'s profile`);
  }
  if (e.target.closest("[data-rate-comment]")) {
    const text = await promptDialog({ title: `Your comment on ${BY_ID[id]?.name || "this agent"}`, label: "Comment", placeholder: "What was good, or what was missing?",
                                      value: cur.comment, ok: "Save", optional: true, multiline: true, max: 500 });
    if (text !== null) saveRating(id, cur.value || 1, text);
  }
});
function markStopped() {
  Object.values(status).forEach(st => {
    if (st.state === "working") st.state = "stopped";
    else if (st.state === "waiting") st.state = "pending";
  });
  document.querySelectorAll(".msg.orch.working").forEach(c => {
    c.classList.remove("working");
    const st = c.querySelector(".head .state"); if (st) st.textContent = "Stopped";
  });
  document.querySelectorAll(".msg.agent.working").forEach(c => {
    c.classList.remove("working");
    c.classList.add("stopped");
    c.querySelector(".state").innerHTML = `${icon("pause", { size: 14 })}Stopped`;
  });
}
/* A new request: the cards of the earlier ones fold to their summary, so the chat stays readable. */
function foldPastCards() {
  document.querySelectorAll(".msg.agent:not(.past):not(.working)").forEach(c => {
    c.classList.add("past");
    c.querySelector(".who .retry")?.insertAdjacentHTML("beforebegin", `<button class="icon-btn plain fold" type="button" data-fold aria-expanded="false"
      title="Show the steps" aria-label="Show the steps">${icon("chevron-down", { size: 15 })}</button>`);
  });
}
function openCard(card, open = true) {
  card.classList.toggle("open", open);
  const b = card.querySelector("[data-fold]"); if (!b) return;
  b.setAttribute("aria-expanded", String(open));
  b.title = open ? "Hide the steps" : "Show the steps"; b.setAttribute("aria-label", b.title);
}
$("messages").addEventListener("click", (e) => {
  const b = e.target.closest("[data-fold]"); if (!b) return;
  const card = b.closest(".msg.agent"); openCard(card, !card.classList.contains("open"));
});
/* ---------- the Orchestrator ----------
   It runs before the team on follow-up prompts and picks the agents the request needs (or answers / asks a question).
   The Brief agent is required: it always runs when any agent runs, so its switch is locked on. */
const REQUIRED = ["brief"];
let orchCard = null;
function lockRequired() { REQUIRED.forEach(id => BY_ID[id] && selected.add(id)); }
function showPlan(ev) {
  if (!orchCard || !orchCard.isConnected || !orchCard.classList.contains("working")) {
    orchCard = addMsg(`<div class="msg orch"><div class="head"><span class="tile">${icon("cpu", { size: 18 })}</span>
      <span><b>Orchestrator</b></span><span class="state"></span></div><p class="why"></p></div>`);
  }
  const card = orchCard;
  card.classList.remove("working");
  const agents = (ev.agents || []).map(id => BY_ID[id] || { id, name: id, icon: "bot", color: "#766a7c" });
  const head = card.querySelector(".head span:nth-child(2)");
  if (head) head.innerHTML = agents.length
    ? `<b>Orchestrator:</b> ${ev.first ? "first build, the whole team works" : `${agents.length} agent${agents.length === 1 ? "" : "s"} on this request`}`
    : `<b>Orchestrator:</b> ${ev.intent === "question" ? "answer" : ev.intent === "off_topic" ? "outside what the team builds" : "a question for you"}`;
  const why = card.querySelector(".why");
  if (why) why.textContent = agents.length ? (ev.first ? "" : ev.reason || "") : (ev.reply || ev.reason || "");
  card.querySelectorAll(".picks, .note").forEach(x => x.remove());
  if (agents.length && !ev.first) {
    card.insertAdjacentHTML("beforeend", `<div class="picks">${agents.map(a =>
      `<span title="${esc((ev.notes || {})[a.id] || a.description || "")}"><span style="color:${esc(a.color)}">${icon(a.icon, { size: 14 })}</span>${esc(a.name)}</span>`).join("")}</div>`);
  }
  const asks = (ev.questions || []).length;
  if (ev.confirm && head) head.innerHTML = `<b>Orchestrator:</b> a plan to confirm`;
  else if (asks && head) head.innerHTML = `<b>Orchestrator:</b> ${asks === 1 ? "one question" : "a few questions"} before the team starts`;
  if (why && (ev.confirm || asks)) { why.textContent = ev.reply || ""; why.setAttribute("data-no-i18n", ""); }
  if (ev.confirm && !card.querySelector(".picks")) {
    card.insertAdjacentHTML("beforeend", `<div class="picks">${agents.map(a =>
      `<span title="${esc((ev.notes || {})[a.id] || a.description || "")}"><span style="color:${esc(a.color)}">${icon(a.icon, { size: 14 })}</span>${esc(a.name)}</span>`).join("")}</div>`);
  }
  if ((ev.parallel || []).length && agents.length) card.insertAdjacentHTML("beforeend",
    `<p class="note par">${icon("split", { size: 14 })}<span>Side by side: ${ev.parallel.map(g => esc(agentNames(g))).join(" · ")}</span></p>`);
  if (ev.fallback) card.insertAdjacentHTML("beforeend", `<p class="note">The Orchestrator couldn't decide, so every agent that's switched on runs.</p>`);
  else if (ev.confirm) addConfirm(card);
  else if (asks) addQuestions(card, ev.questions);
  else if (!agents.length) card.insertAdjacentHTML("beforeend", `<p class="note">No agent ran. Reply here to go on.</p>`);
  orchCard = null;
  if (!agents.length || ev.confirm || asks) { setBusy(false); renderTeam(); }
  if (!replaying) scrollDown();
}

/* ---------- the Orchestrator's questions ----------
   A plan to confirm (Yes, start / Cancel) or a short form (pick one, pick several, or type), answered in the chat.
   A card closes as soon as the user answers, cancels or simply writes a new message. */
function addConfirm(card) {
  card.classList.add("asking");
  card.insertAdjacentHTML("beforeend", `<div class="ask"><div class="ask-bar">
    <button class="btn btn-dark btn-sm" type="button" data-ask="confirm">${icon("play", { size: 14 })}Yes, start</button>
    <button class="btn btn-ghost btn-sm" type="button" data-ask="cancel">Cancel</button>
    <span class="hint">Or write what to change below.</span></div></div>`);
  card.querySelectorAll("[data-ask]").forEach(b => b.onclick = () => {
    if (busy) return toast("Agents are already working. Stop them first.", "err");
    card.querySelectorAll("[data-ask]").forEach(x => x.disabled = true);
    b.setAttribute("aria-busy", "true");
    if (!wsSend({ type: "answer", action: b.dataset.ask })) card.querySelectorAll("[data-ask]").forEach(x => { x.disabled = false; x.removeAttribute("aria-busy"); });
  });
}
function addQuestions(card, questions) {
  card.classList.add("asking");
  const n = card.dataset.ask = `ask${Date.now()}${Math.random().toString(36).slice(2, 6)}`;
  const field = (q, i) => {
    const name = `${n}-${q.id}`, type = q.kind === "multi" ? "checkbox" : "radio";
    const opts = q.kind === "text" ? "" : `<div class="opts" role="${type === "radio" ? "radiogroup" : "group"}">${q.options.map(o =>
      `<label class="opt"><input type="${type}" name="${esc(name)}" value="${esc(o)}"><span data-no-i18n>${icon("check", { size: 14 })}${esc(o)}</span></label>`).join("")}</div>`;
    const free = q.kind === "text" || q.other
      ? `<input class="free" type="text" maxlength="300" name="${esc(name)}-free" aria-label="${esc(q.kind === "text" ? q.text : "Your own answer")}"
           placeholder="${esc(q.kind === "text" ? (q.placeholder || "Type your answer") : "Or type your own answer")}"${q.kind === "text" && q.placeholder ? " data-no-i18n" : ""}>` : "";
    return `<fieldset data-q="${esc(q.id)}" data-kind="${esc(q.kind)}"><legend><span class="num">${i + 1}</span><span data-no-i18n>${esc(q.text)}</span></legend>${opts}${free}</fieldset>`;
  };
  card.insertAdjacentHTML("beforeend", `<form class="ask" novalidate>${questions.map(field).join("")}
    <div class="ask-bar">
      <button class="btn btn-dark btn-sm" type="submit" disabled>${icon("arrow-up", { size: 14 })}Send answers</button>
      <button class="btn btn-ghost btn-sm" type="button" data-skip>Skip, let the team decide</button>
      <span class="hint">You can leave any question blank.</span>
    </div></form>`);
  const form = card.querySelector("form.ask"), send = form.querySelector('[type="submit"]');
  const collect = () => {
    const out = {};
    form.querySelectorAll("fieldset[data-q]").forEach(fs => {
      const picked = [...fs.querySelectorAll("input:checked")].map(x => x.value);
      const typed = fs.querySelector(".free")?.value.trim();
      const values = fs.dataset.kind === "multi" ? [...picked, ...(typed ? [typed] : [])] : (typed ? [typed] : picked);
      if (values.length) out[fs.dataset.q] = fs.dataset.kind === "multi" ? values : values[0];
    });
    return out;
  };
  form.addEventListener("input", (e) => {
    const fs = e.target.closest("fieldset");
    // in a pick-one question, typing your own answer replaces the chosen option, and choosing one clears what you typed
    if (fs?.dataset.kind === "single") {
      if (e.target.classList.contains("free") && e.target.value.trim()) fs.querySelectorAll("input:checked").forEach(x => x.checked = false);
      if (e.target.type === "radio") { const f = fs.querySelector(".free"); if (f) f.value = ""; }
    }
    send.disabled = !Object.keys(collect()).length;
  });
  const submit = (answers) => {
    if (busy) return toast("Agents are already working. Stop them first.", "err");
    form.querySelectorAll("button").forEach(x => x.disabled = true);
    send.setAttribute("aria-busy", "true");
    if (!wsSend({ type: "answer", action: "answers", answers })) {
      form.querySelectorAll("button").forEach(x => x.disabled = false);
      send.removeAttribute("aria-busy");
      send.disabled = !Object.keys(collect()).length;
    }
  };
  form.onsubmit = (e) => { e.preventDefault(); const a = collect(); if (Object.keys(a).length) submit(a); };
  form.querySelector("[data-skip]").onclick = () => submit({});
  if (!replaying) setTimeout(() => form.querySelector("input")?.focus({ preventScroll: true }), 50);
}
function closeAsks(label) {
  document.querySelectorAll(".msg.orch.asking").forEach(card => {
    card.classList.remove("asking");
    card.classList.add("answered");
    const ask = card.querySelector(".ask");
    if (!ask) return;
    ask.querySelectorAll("input, button").forEach(x => x.disabled = true);
    ask.querySelector(".ask-bar")?.replaceChildren();
    ask.querySelector(".ask-bar")?.insertAdjacentHTML("beforeend", `<span class="done">${icon("check", { size: 14 })}${esc(label)}</span>`);
  });
}

function tick() {
  if (!run) return;
  document.querySelectorAll(".msg.agent.working .timer").forEach(t => {
    t.textContent = duration((Date.now() - t.closest(".msg").dataset.started) / 1000);
  });
  Object.keys(status).forEach(id => status[id].state === "working" && renderTile(id));
  renderTeamHead();
}

function setBusy(b) {

  $("send").classList.toggle("stop", b);

$("composer").onsubmit = async (e) => {

  lastPrompt = text;

let pendingPrompt = null;
function restorePrompt() {

// name + description (both required) & copy id
const needsDetails = () => !project.description || project.name === "Untitled project";
/* ---------- project details (name, description, pages, brief): a form in the Project tab ----------
   Opening them (the title, the description, the command palette, or a run that needs them) shows that tab and focuses
   the form. The form is kept while someone types in it, even when the tab re-renders after an agent. */
let detailsHost = null, detailsDirty = false, detailsNote = "";
function detailsForm() {
  if (detailsHost && detailsDirty) return detailsHost;

  host.className = "pj-details";
  const form = fillProjectForm(host, {
    heading: false, ok: "Save details", cancellable: false,
    name: project.name === "Untitled project" ? "" : project.name, description: project.description || "",
    pages: (project.pages || [{ title: "Home" }]).map(p => p.title), brief: project.brief || {},
  }, async (details, e) => {
    e.preventDefault();

    go.disabled = true; go.setAttribute("aria-busy", "true");

      project = { ...project, ...(await api(`/api/projects/${PID}`, { method: "PATCH", body: JSON.stringify(details) })) };
      detailsDirty = false; detailsNote = "";
      renderHeader(); renderPages(); toast("Project details saved");
      if (tabOn("project")) renderProject();
    } catch (err) {
      go.disabled = false; go.removeAttribute("aria-busy");

    }
  });
  host.addEventListener("input", () => { detailsDirty = true; });
  if (!canEdit) host.querySelectorAll("input, textarea, select, button").forEach(x => { x.disabled = true; });
  detailsHost = host; host._form = form;
  return host;
}
async function editDetails({ required = false, note = "" } = {}) {
  if (required) detailsNote = note || "This project is missing its name or description. The agents read both, so be specific.";
  if (onPhone()) showM("site");
  if (!tabOn("project")) showTab("project");
  await renderProject();
  const card = $("briefCard");
  card?.scrollIntoView({ behavior: "smooth", block: "start" });

$("pname").addEventListener("click", () => editDetails());
$("pname").addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); editDetails(); } });
$("pdesc").addEventListener("click", () => editDetails());
$("pid").onclick = async () => {
  try { await navigator.clipboard.writeText(PID); toast("Project id copied"); } catch { toast(PID); }
};

// ================================================================ stop · continue · start again
function restoreStatuses(r) {
  Object.keys(status).forEach(k => delete status[k]);
  r.agents.forEach(id => {
    status[id] = { state: r.done.includes(id) ? "done" : (r.running?.length ? r.running.includes(id) : id === r.current) ? "stopped" : "pending" };
  });
}
/* ---------- long chats: keep only the latest messages in the page, load earlier ones on scroll up ----------
   The whole history is replayed once (that is how agent states and resume cards are rebuilt), then everything
   but the last CHAT_WINDOW messages is taken out of the page and kept in `folded`. Scrolling to the top (or the
   button) puts the previous batch back, keeping the scroll position steady. */
const CHAT_WINDOW = 40, CHAT_BATCH = 30;
let folded = [], foldObserver = null;
function foldHistory() {
  const box = $("messages"), all = [...box.children];
  if (all.length <= CHAT_WINDOW + 10) return;
  folded = all.slice(0, all.length - CHAT_WINDOW);
  folded.forEach(n => n.remove());
  box.insertAdjacentHTML("afterbegin", `<div class="load-more" id="earlier"><button class="btn btn-ghost btn-sm" type="button">${icon("history", { size: 14 })}<span></span></button></div>`);
  $("earlier").querySelector("button").onclick = showEarlier;
  updateEarlier();
}
function updateEarlier() {
  const el = $("earlier"); if (!el) return;
  if (!folded.length) { foldObserver?.disconnect(); el.remove(); return; }
  el.querySelector("span").textContent = `Show ${folded.length} earlier message${folded.length === 1 ? "" : "s"}`;
  foldObserver?.disconnect();
  foldObserver = onVisible(el, showEarlier, $("messages"));
}
function showEarlier() {
  const box = $("messages"), anchor = $("earlier"); if (!anchor || !folded.length) return;
  const batch = folded.splice(Math.max(0, folded.length - CHAT_BATCH));
  // a stale "Continue / Start again" card must not come back to life
  if (!paused || document.querySelector(".resume-card:not(.used)"))
    batch.forEach(n => (n.matches?.(".resume-card") ? [n] : [...(n.querySelectorAll?.(".resume-card") || [])]).forEach(c => c.classList.add("used")));
  const before = box.scrollHeight, top = box.scrollTop;
  box.classList.add("replay");               // no pop-in animation for history
  anchor.after(...batch);
  box.scrollTop = top + (box.scrollHeight - before);
  requestAnimationFrame(() => box.classList.remove("replay"));
  updateEarlier();
}

function disableResumeCards() {
  document.querySelectorAll(".resume-card:not(.used)").forEach(c => c.classList.add("used"));
}
function addResumeCard(r) {
  disableResumeCards();
  const at = BY_ID[r.next]?.name || r.next, total = r.agents.length, doneN = r.done.length;
  const title = r.status === "error" ? `Run failed at ${at}` : r.status === "interrupted" ? `Run interrupted at ${at}` : `Run stopped at ${at}`;
  const why = r.status === "interrupted" ? "The server restarted while the agents were working. " : "";
  addMsg(`<div class="msg resume-card ${r.status === "error" ? "error" : ""}">
    <div class="rc-text"><span class="tile">${icon(r.status === "error" ? "alert" : "pause", { size: 18 })}</span>
      <div><b>${esc(title)}</b><small>${why}${doneN} of ${total} agents finished. Their work is saved. Continue from ${esc(at)}, or run the whole team again.</small></div></div>
    <div class="rc-actions">
      <button class="btn btn-dark btn-sm" data-resume="continue">${icon("play", { size: 14 })}Continue from ${esc(at)}</button>
      <button class="btn btn-ghost btn-sm" data-resume="restart">${icon("refresh", { size: 14 })}Start again</button>
    </div></div>`);
}
async function resumeRun(mode) {
  if (busy || !paused) return;
  if (ws?.readyState !== 1) return toast("Not connected to the server yet", "err");
  if (mode === "restart" && !await confirmDialog({
    title: "Start again?", ok: "Start again",
    text: `All ${paused.agents.length} agents will run again from the first one, on the same request. The files built so far are kept and reworked.` })) return;
  if (!await flushEdits()) return;
  wsSend({ type: mode });
}
document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-resume]");
  if (b) resumeRun(b.dataset.resume);
});

// ================================================================ phones: Chat or Site
function showM(which) {

  $("mSwitch").querySelectorAll("button").forEach(b => b.setAttribute("aria-selected", b.dataset.m === which ? "true" : "false"));
  if (which === "site") { $("mSwitch").querySelector(".m-dot").hidden = true; reloadPreview(); }
}
document.body.dataset.m = "chat";
$("mSwitch").addEventListener("click", (e) => { const b = e.target.closest("[data-m]"); if (b) showM(b.dataset.m); });
const onPhone = () => matchMedia("(max-width: 900px)").matches;

// ================================================================ team panel
const tileEl = (id) => document.querySelector(`.agent-tile[data-id="${CSS.escape(id)}"]`);

function tileHTML(a, i) {
  const on = selected.has(a.id), st = status[a.id];
  const state = st?.state || (on ? "ready" : "off");
  let line = "", last = "";
  if (state === "off") line = "Not in the team";
  else if (state === "ready") line = "Ready";
  else if (state === "waiting") line = `${icon("clock", { size: 12 })}Waiting`;
  else if (state === "working") {
    line = `<span class="typing"><span></span><span></span><span></span></span>Working · ${duration((Date.now() - st.started) / 1000)}`;
    last = st.last || "Reading the project…";
  } else if (state === "done") {
    line = `${icon("check", { size: 12 })}Done${st.started && st.ended ? " · " + duration((st.ended - st.started) / 1000) : ""}`;
  } else if (state === "stopped") line = `${icon("pause", { size: 12 })}Stopped here`;
  else if (state === "pending") line = `${icon("clock", { size: 12 })}Not started`;
  else if (state === "skipped") line = "Not needed this time";
  const locked = REQUIRED.includes(a.id);
  return `<div class="agent-tile s-${state} ${on || st ? "" : "off"}" data-id="${esc(a.id)}" style="--c:${a.color}" ${cards[a.id] ? 'tabindex="0"' : ""}
      role="group" aria-label="${esc(a.name)} agent, ${state}${a.description ? ": " + esc(a.description) : ""}"
      title="${esc(a.description ? a.description + "\n\n" : "")}${locked ? "Required: always runs when the team works" : cards[a.id] ? "Click to show in chat" : ""}">
    <div class="t-top"><span class="tile">${icon(a.icon, { size: 16 })}</span>
      <span class="t-id"><span class="t-name">${esc(a.name)}</span><span class="t-meta"><span class="t-num">${String(i + 1).padStart(2, "0")}</span>
      ${a.model_ok === false ? `<a class="model-badge" style="color:var(--danger)" href="/agents/${encodeURIComponent(a.id)}/edit" title="Not a known model. Click to fix">${icon("alert", { size: 10 })}${esc(a.model)}</a>`
        : a.model ? `<span class="model-badge" title="Runs on ${esc(a.model)}" data-no-i18n>${esc(a.model.replace(/^claude-/, ""))}</span>` : ""}</span></span>
      ${locked ? `<span class="t-lock" title="Required: always runs">${icon("lock", { size: 13 })}</span>`
        : on ? `<button class="icon-btn plain t-remove" data-remove title="Remove ${esc(a.name)} from this project's team" aria-label="Remove ${esc(a.name)} from the team" ${busy ? "disabled" : ""}>${icon("x", { size: 14 })}</button>` : ""}</div>
    <div class="t-status">${line}</div>
    ${state === "working" ? `<div class="t-last">${esc(last)}</div>` : `<div class="t-desc">${esc(a.description || "")}</div>`}
  </div>`;
}
/* The strip shows this project's team only (plus any agent of the current run's history): agents and teams are
   chosen in the marketplace, which sends them back here. */
const teamList = () => AGENTS.filter(a => selected.has(a.id) || status[a.id]);
function renderTile(id) {
  const list = teamList(), el = tileEl(id), i = list.findIndex(a => a.id === id);
  if (!el || i < 0) return;
  const was = [...el.classList].find(c => c.startsWith("s-"));
  el.outerHTML = tileHTML(list[i], i);
  // a short "stamp" when an agent starts or finishes, so the change is easy to catch
  const now = tileEl(id), is = now && [...now.classList].find(c => c.startsWith("s-"));
  if (now && was !== is && (is === "s-working" || is === "s-done") && !replaying) {
    now.classList.add("flip"); now.addEventListener("animationend", () => now.classList.remove("flip"), { once: true });
  }
}
function renderTeam() {

    <a class="agent-tile add-tile" href="/hire" data-hire-link="agents">${icon("plus", { size: 18 })}<span><b>Add an agent</b><small>Pick a specialist in the marketplace</small></span></a>`);
  renderTeamHead();
  // keep the working agent in view
  const working = Object.keys(status).find(id => status[id].state === "working");
  if (working && !replaying) tileEl(working)?.scrollIntoView({ block: "nearest", inline: "nearest", behavior: "smooth" });
}
function renderTeamHead() {
  const team = AGENTS.filter(a => selected.has(a.id));
  $("teamHint").textContent = `${team.length} agent${team.length === 1 ? "" : "s"} in the team`;
  const chevron = `<button class="icon-btn plain" id="collapse" title="${collapsed ? "Show" : "Hide"} the team" aria-expanded="${!collapsed}">
    ${icon(collapsed ? "chevron-up" : "chevron-down", { size: 16 })}</button>`;
  if (run && busy) {
    const total = run.agents.length, i = Math.max(run.index, 0), cur = BY_ID[run.agents[i]];
    const done = Object.values(status).filter(s => s.state === "done").length;
    const together = run.agents.filter(id => status[id]?.state === "working");
    $("progress").style.width = `${((done + (run.index >= 0 ? .5 : 0)) / total) * 100}%`;
    $("teamHead").innerHTML = `<h3>${icon("users", { size: 16 })}Team</h3>
      <span class="now"><span class="typing"><span></span><span></span><span></span></span>
        Step <b>${i + 1}</b> of ${total} · ${together.length > 1 ? `<b>${esc(agentNames(together))}</b> are working side by side` : `<b>${esc(cur?.name || "…")}</b> is working`}</span>
      <span class="spacer"></span>
      <span class="clock">${icon("clock", { size: 13 })}${duration((Date.now() - run.started) / 1000)}</span>${chevron}`;
  } else if (busy && !run) {

/* The studio's state lives in the address, so a reload, a bookmark or a shared link opens the same view:
   /p/<id>?tab=code&file=style.css&page=about.html&device=phone (defaults are left out). Old links like #code still work. */
const SAFE_FILE = /^[\w.-]+(\/[\w.-]+)*$/;
let stateRead = false;          // nothing is written to the address before it has been read
function restoreState() {
  stateRead = true;
  const q = new URLSearchParams(location.search);
  const page = q.get("page"), file = q.get("file"), device = q.get("device");
  if (page && /^[\w.-]+\.html?$/i.test(page)) currentPage = page;
  if (file && SAFE_FILE.test(file) && !file.split("/").includes("..")) currentFile = file;
  if (device) document.querySelector(`#devices [data-device="${CSS.escape(device)}"]`)?.click();
  if (["comments", "links", "people"].includes(q.get("section"))) shareSec = q.get("section");
  const tab = q.get("tab") || location.hash.slice(1);
  return PANES[tab] ? tab : null;
}
function saveState() {
  if (!stateRead) return;
  const q = new URLSearchParams();
  const tab = document.querySelector("#tabs button.on")?.dataset.tab;
  const device = document.querySelector("#devices button.on")?.dataset.device;
  if (tab && tab !== "preview") q.set("tab", tab);
  if (currentPage !== "index.html") q.set("page", currentPage);
  if (device && device !== "desktop") q.set("device", device);
  if (tab === "code" && currentFile !== "index.html") q.set("file", currentFile);
  if (tab === "share" && shareSec && shareSec !== "comments") q.set("section", shareSec);
  const url = location.pathname + (q.size ? `?${q}` : "");
  if (url !== location.pathname + location.search + location.hash) history.replaceState(history.state, "", url);
}

/* Arrow keys, Home and End move between the tabs (and open them), as in any tab list. */
$("tabs").addEventListener("keydown", (e) => {
  const all = [...$("tabs").querySelectorAll("[role=tab]")], i = all.indexOf(document.activeElement);
  if (i < 0) return;
  const rtl = document.documentElement.dir === "rtl";
  const step = { ArrowRight: rtl ? -1 : 1, ArrowLeft: rtl ? 1 : -1 }[e.key];
  const to = e.key === "Home" ? 0 : e.key === "End" ? all.length - 1 : step ? (i + step + all.length) % all.length : -1;

/* research.md, written by the Research agent, shown as a formatted page. A small Markdown subset, rendered safely:
   everything is escaped first, only http(s) links are made clickable, and [n] citations jump to source n. */
function mdInline(t) {
  let h = esc(t);
  const keep = [];
  const stash = (html) => `\u0000${keep.push(html) - 1}\u0000`;
  h = h.replace(/`([^`]+)`/g, (_, c) => stash(`<code>${c}</code>`));
  h = h.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, (_, label, url) => stash(`<a href="${url}" target="_blank" rel="noopener noreferrer">${label}</a>`));
  h = h.replace(/(^|[\s(])(https?:\/\/[^\s<)]+[^\s<).,;:!?])/g, (_, pre, url) => pre + stash(`<a href="${url}" target="_blank" rel="noopener noreferrer">${url}</a>`));
  h = h.replace(/\[(\d{1,3})\](?!\()/g, (_, n) => stash(`<a class="cite" href="#src-${n}" data-cite="${n}">[${n}]</a>`));
  h = h.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>").replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<em>$2</em>");
  return h.replace(/\u0000(\d+)\u0000/g, (_, i) => keep[+i]);
}

}

  if (e.target.closest("#saveVersion")) {
    if (busy) return toast("Versions are saved automatically while agents work");
    if (!await flushEdits()) return;
    const label = await promptDialog({ title: "Save a version", label: "Label", placeholder: "e.g. Before trying a dark theme", ok: "Save version", optional: true, max: 80 });
    if (label === null) return;
    await withBusy($("saveVersion"), async () => { const v = await api(`/api/projects/${PID}/versions`, { method: "POST", body: JSON.stringify({ label }) }); toast(`Saved as v${v.n}`); loadVersions(); },
      { onError: (err) => toast(`The version wasn't saved: ${err.message}`, "err") });
  }
  if (restore) {
    const n = +restore.dataset.vrestore;
    if (busy) return toast("Agents are working. Restore when they finish");
    if (!await confirmDialog({ title: `Restore version ${n}?`, ok: "Restore",
      text: "The project's code goes back to this version. The current code is saved as a new version first, so nothing is lost." })) return;
    if (!await flushEdits()) return;
    await withBusy(restore, () => api(`/api/projects/${PID}/versions/${n}/restore`, { method: "POST" }),
      { onError: (err) => toast(`v${n} wasn't restored: ${err.message}`, "err") });
  }
});

/* ---------- this project's brand kit: saved as you change it; agents follow it from the next request ---------- */
async function openBrand() {
  let kit, sources;
  try { [kit, sources] = await Promise.all([api(`/api/projects/${PID}/brand`), api("/api/brand/sources").catch(() => [])]); }
  catch (err) { return toast(`Couldn't open the brand kit: ${err.message}`, "err"); }
  const d = document.createElement("dialog");
  d.className = "modal project-modal brand-modal";
  d.innerHTML = `<form method="dialog"><h3>Brand kit</h3>
    <p>${canRate ? "This project's logo, colours and fonts. Every agent follows them from the next request." : "Only the project's owner can change its brand kit."}</p>
    <fieldset ${canRate ? "" : "disabled"}>${brandFieldsHTML(canRate ? sources.filter(k => k.id !== PID) : [])}</fieldset>
    <div class="row"><span class="bk-saved" role="status"></span><button class="btn btn-dark" value="close">Done</button></div></form>`;
  document.body.append(d);
  const saved = (text) => { d.querySelector(".bk-saved").textContent = text; };
  const call = async (path, method, body) => {
    const k = await api(path, { method, ...(body ? { body: JSON.stringify(body) } : {}), timeout: 60000 });
    saved("Saved"); return k;
  };
  let logoChanged = false;
  bindBrandFields(d.querySelector(".bk"), kit, { sources, live: {
    change: (v) => call(`/api/projects/${PID}/brand`, "PUT", v).catch(err => toast(err.message, "err")),
    logo: (data) => { logoChanged = true; return call(`/api/projects/${PID}/brand/logo`, "POST", { data }); },
    removeLogo: () => { logoChanged = true; return call(`/api/projects/${PID}/brand/logo`, "DELETE"); },
    copy: (from) => { logoChanged = true; return call(`/api/projects/${PID}/brand/copy`, "POST", { from }); },
  } });
  d.addEventListener("click", (e) => { if (e.target === d) d.close(); });
  d.addEventListener("close", async () => {
    d.remove(); if (logoChanged) refreshCode?.();
    if (tabOn("project")) { await syncProject(); renderProject(); }
  });
  d.showModal();
}

  const focusKey = focused && draftKey(focused), caret = focusKey && "selectionStart" in focused ? [focused.selectionStart, focused.selectionEnd] : null;
  $("sharePane").innerHTML = `<div class="pane-in pj sh">
    <div class="pane-head"><h2>Share</h2><span class="meta">Show the site to people without an account, collect their comments, and choose who works on it</span></div>
    ${nav}
    <div class="sh-body">${shareSec === "links" ? linksSec : shareSec === "people" ? peopleSec : commentsSec}</div></div>`;
  for (const el of $("sharePane").querySelectorAll("#shNew [name], #shInvite [name], [data-keep]")) {
    const k = draftKey(el);
    if (k && k in shareDrafts) { if (el.type === "checkbox") el.checked = shareDrafts[k]; else el.value = shareDrafts[k]; }
    if (k && k === focusKey) { el.focus({ preventScroll: true }); if (caret) try { el.setSelectionRange(...caret); } catch {} }
  }
}
const clearDrafts = (prefix) => Object.keys(shareDrafts).forEach(k => { if (k.startsWith(prefix)) delete shareDrafts[k]; });
const showShareSec = (sec) => { shareSec = sec; if (shareData) renderShare(); saveState(); };
$("sharePane").addEventListener("input", (e) => {
  e.target.removeAttribute?.("aria-invalid");
  const k = draftKey(e.target); if (k) shareDrafts[k] = e.target.type === "checkbox" ? e.target.checked : e.target.value;
});
$("sharePane").addEventListener("toggle", (e) => { if (e.target.matches?.(".sh-old")) shareUI.oldOpen = e.target.open; }, true);
$("sharePane").addEventListener("keydown", (e) => {
  if (e.key === "Escape" && e.target.closest("[data-reply-form], [data-rename-form]")) {
    e.preventDefault(); e.target.closest("form").querySelector("[data-reply-cancel], [data-rename-cancel]")?.click(); return;
  }
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey) && e.target.closest("[data-reply-form]")) { e.preventDefault(); e.target.form.requestSubmit(); return; }
  const tab = e.target.closest(".sh-nav [role=tab]"); if (!tab) return;   // arrow keys between the three sections
  const all = [...tab.parentElement.children], rtl = document.documentElement.dir === "rtl";
  const step = { ArrowRight: rtl ? -1 : 1, ArrowLeft: rtl ? 1 : -1 }[e.key]; if (!step) return;
  e.preventDefault(); const to = all[(all.indexOf(tab) + step + all.length) % all.length];
  showShareSec(to.dataset.sec); $("sharePane").querySelector(`.sh-nav [data-sec="${to.dataset.sec}"]`)?.focus();
});
$("sharePane").addEventListener("submit", async (e) => {
  e.preventDefault();
  const f = e.target, btn = f.querySelector("button[type=submit]");
  btn.disabled = true;
  try {
    if (f.id === "shNew") {
      const l = await api(`/api/projects/${PID}/share`, { method: "POST", body: JSON.stringify({
        label: f.label.value.trim(), days: +f.days.value, comments: f.comments.checked, version: f.version.value }) });
      clearDrafts("shNew:");
      await navigator.clipboard?.writeText(shareUrl(l)).then(() => toast("Link created and copied"), () => toast("Link created"));
    } else if (f.id === "shInvite") {
      const r = await api(`/api/projects/${PID}/people`, { method: "POST", body: JSON.stringify({ email: f.email.value.trim(), role: f.role.value }) });
      clearDrafts("shInvite:");
      toast(r.joined ? `${r.email} can open this project now` : `Invitation sent to ${r.email}: they join when they create their account`);
    } else if (f.dataset.replyForm) {
      const text = f.querySelector("textarea").value.trim();
      await api(`/api/projects/${PID}/comments/${f.dataset.replyForm}/reply`, { method: "POST", body: JSON.stringify({ text }) });
      clearDrafts(`k:reply-${f.dataset.replyForm}`); shareUI.replying = null;
      toast(text ? "Reply sent: the visitor sees it under their comment" : "Reply removed");
    } else if (f.dataset.renameForm) {
      await api(`/api/projects/${PID}/share/${f.dataset.renameForm}`, { method: "PATCH", body: JSON.stringify({ label: f.label.value.trim() }) });
      clearDrafts(`k:rename-${f.dataset.renameForm}`); shareUI.renaming = null;
      toast("Link renamed");
    }
    f.reset();
    await loadShare();
  } catch (err) {
    btn.disabled = false; toast(err.message, "err");
    if (f.id === "shInvite" && err.status >= 400 && err.status < 500 && err.status !== 429) { f.email.setAttribute("aria-invalid", "true"); f.email.focus(); }
  }
});
$("sharePane").addEventListener("change", async (e) => {
  const k = draftKey(e.target); if (k) shareDrafts[k] = e.target.type === "checkbox" ? e.target.checked : e.target.value;
  if (e.target.matches("[data-cpage]")) { shareUI.page = e.target.value; return renderShare(); }
  if (e.target.matches("[data-clink]")) { shareUI.link = e.target.value; return renderShare(); }
  const sw = e.target.closest("[data-link-comments]");
  if (sw) return withBusy(sw, async () => {
    await api(`/api/projects/${PID}/share/${sw.dataset.linkComments}`, { method: "PATCH", body: JSON.stringify({ comments: sw.checked }) });
    toast(sw.checked ? "Visitors of this link can pin comments" : "Comments are off for this link"); await loadShare();
  }, { onError: (err) => { sw.checked = !sw.checked; toast(err.message, "err"); } });
  const end = e.target.closest("[data-link-days]");
  if (end) {
    if (end.value === "") return;
    return withBusy(end, async () => {
      await api(`/api/projects/${PID}/share/${end.dataset.linkDays}`, { method: "PATCH", body: JSON.stringify({ days: +end.value }) });
      toast(+end.value ? "New end date saved" : "This link never expires now"); await loadShare();
    }, { onError: (err) => { end.value = ""; toast(err.message, "err"); } });
  }
  const sel = e.target.closest("[data-role]"); if (!sel) return;
  await withBusy(sel, async () => { await api(`/api/projects/${PID}/people/${sel.dataset.role}`, { method: "PATCH", body: JSON.stringify({ role: sel.value }) }); toast("Role changed"); },
    { onError: (err) => { toast(err.message, "err"); loadShare(); } });
});
$("sharePane").addEventListener("click", async (e) => {
  const t = (sel) => e.target.closest(sel);
  const btn = e.target.closest("button");
  const call = (path, opts, done) => withBusy(btn, async () => { await api(path, opts); if (done) toast(done); await loadShare(); });
  const focusIn = (sel) => { const el = $("sharePane").querySelector(sel); if (el) { el.focus(); el.select?.(); } };
  if (t("[data-sec]")) { showShareSec(t("[data-sec]").dataset.sec); if (shareSec === "links" && !$("sharePane").querySelector(".sh-link")) focusIn("#shNew [name=label]"); return; }
  if (t("[data-cfilter]")) { shareFilter = t("[data-cfilter]").dataset.cfilter; return renderShare(); }
  if (t("[data-filter-reset]")) { shareUI.page = shareUI.link = ""; return renderShare(); }
  if (t("[data-link-filter]")) { shareUI.link = t("[data-link-filter]").dataset.linkFilter; shareUI.page = ""; return showShareSec("comments"); }
  if (t("[data-reply-open]")) { shareUI.replying = t("[data-reply-open]").dataset.replyOpen; renderShare(); return focusIn(`[data-reply-form="${CSS.escape(shareUI.replying)}"] textarea`); }
  if (t("[data-reply-cancel]")) { clearDrafts(`k:reply-${shareUI.replying}`); shareUI.replying = null; return renderShare(); }
  if (t("[data-reply-remove]")) {
    const id = t("[data-reply-remove]").dataset.replyRemove;
    if (!await confirmDialog({ title: "Remove your reply?", text: "The visitor won't see it on the shared page any more.", ok: "Remove", danger: true })) return;
    return withBusy(btn, async () => { await api(`/api/projects/${PID}/comments/${id}/reply`, { method: "POST", body: JSON.stringify({ text: "" }) });
      clearDrafts(`k:reply-${id}`); shareUI.replying = null; toast("Reply removed"); await loadShare(); });
  }
  if (t("[data-rename]")) { shareUI.renaming = t("[data-rename]").dataset.rename; renderShare(); return focusIn(`[data-rename-form="${CSS.escape(shareUI.renaming)}"] input`); }
  if (t("[data-rename-cancel]")) { clearDrafts(`k:rename-${shareUI.renaming}`); shareUI.renaming = null; return renderShare(); }
  if (t("[data-copy-link]")) {
    const url = `${location.origin}/s/${t("[data-copy-link]").dataset.copyLink}`;
    return navigator.clipboard?.writeText(url).then(() => toast("Link copied"), () => toast(url));
  }
  if (t("[data-show-page]")) {
    const sel = $("pageSel"), pg = t("[data-show-page]").dataset.showPage;
    if ([...sel.options].some(o => o.value === pg)) { sel.value = pg; sel.dispatchEvent(new Event("change")); }
    return showTab("preview");
  }
  if (t("[data-revoke]")) {
    if (!await confirmDialog({ title: "Turn this link off?", text: "Whoever has it won't be able to open the site any more. Its comments stay here.", ok: "Turn off", danger: true })) return;
    return call(`/api/projects/${PID}/share/${t("[data-revoke]").dataset.revoke}`, { method: "DELETE" }, "Link turned off");
  }
  if (t("[data-resolve]")) {
    const b = t("[data-resolve]");
    return call(`/api/projects/${PID}/comments/${b.dataset.resolve}`, { method: "PATCH", body: JSON.stringify({ resolved: b.dataset.done === "1" }) });
  }
  if (t("[data-del-comment]")) {
    if (!await confirmDialog({ title: "Delete this comment?", text: "It's removed for everyone, including the person who wrote it.", ok: "Delete", danger: true })) return;
    return call(`/api/projects/${PID}/comments/${t("[data-del-comment]").dataset.delComment}`, { method: "DELETE" });
  }
  if (t("[data-ask-comment]")) {
    const c = shareData.comments.find(x => x.id === t("[data-ask-comment]").dataset.askComment); if (!c) return;
    return fillComposer(`Someone reviewing the site left this comment ${commentAsk(c)}\nMake the change it asks for and keep everything else as it is.`);
  }
  if (t("[data-ask-all]")) {
    const list = shareData.comments.filter(c => !c.resolved); if (!list.length) return;
    return fillComposer(askAllText(list));
  }
  if (t("[data-remove-person]")) {
    if (!await confirmDialog({ title: "Remove this person?", text: "They won't be able to open this project any more.", ok: "Remove", danger: true })) return;
    return call(`/api/projects/${PID}/people/${t("[data-remove-person]").dataset.removePerson}`, { method: "DELETE" }, "Removed from the project");
  }
  if (t("[data-cancel-invite]")) return call(`/api/projects/${PID}/invites?email=${encodeURIComponent(t("[data-cancel-invite]").dataset.cancelInvite)}`, { method: "DELETE" }, "Invitation cancelled");
  if (t("[data-leave]")) {
    if (!await confirmDialog({ title: "Leave this project?", text: "You won't see it any more unless its owner invites you again.", ok: "Leave", danger: true })) return;
    await withBusy(btn, async () => { await api(`/api/projects/${PID}/membership`, { method: "DELETE" }); location.replace("/projects"); });
  }
});

// ---------- stats (cost & time)
let agentsPg, sPage = 1, sPer = perPagePref("statsAgents", 10), rPage = 1, rPer = perPagePref("statsRuns", 10);
async function loadStats() {
  const body = $("statsBody");
  let data;
  const qs = new URLSearchParams({ page: rPage, per_page: rPer });
  qs.set("project", PID);
  try { data = await api(`/api/stats?${qs}`); }
  catch (err) { return showError(body, err, loadStats, "Couldn't load the stats"); }
  const t = data.totals, maxCost = Math.max(...data.agents.map(a => a.cost), 1e-9), maxSec = Math.max(...data.agents.map(a => a.seconds), 1e-9);
  if (!t.runs && !data.agents.length) {
    body.innerHTML = `<div class="pempty"><span class="tile">${icon("chart", { size: 22 })}</span><b>No runs yet</b>
      <p>Cost, time and tokens for each agent appear here after the team's first run, with the recent runs of this project.</p></div>`;
    return;
  }
  body.innerHTML = `
    <div class="kpis">
      <div class="kpi"><b>${money(t.cost)}</b><span>estimated cost</span></div>
      <div class="kpi"><b>${duration(t.seconds)}</b><span>total agent time</span></div>
      <div class="kpi"><b>${t.runs}</b><span>agent runs${t.failed ? ` · ${t.failed} stopped or failed` : ""}</span></div>
      <div class="kpi"><b>${compact(t.tokens_in + t.tokens_out)}</b><span>tokens · ${compact(t.tokens_in)} in · ${compact(t.tokens_out)} out</span></div>
    </div>
    <p class="note">${icon("alert", { size: 14 })}<span>Cost is the API-equivalent estimate Claude Code reports for each agent run. On a Claude subscription you aren't billed per call, but it shows which agents use the most.</span></p>
    ${data.agents.length ? `
    <h4 class="sec">Per agent</h4>
    <div class="tbl-wrap"><table class="stable"><thead><tr><th>Agent</th><th class="c-model">Model</th><th class="num">Runs</th><th class="num">Avg time</th><th class="c-bar">Time share</th><th class="num c-avg">Avg cost</th><th class="c-bar">Cost share</th><th class="num">Total cost</th></tr></thead><tbody>
    ${(agentsPg = paginate(data.agents, sPage, sPer), sPage = agentsPg.page, agentsPg).items.map(a => `<tr>
      <td><span class="ag"><span class="tile" style="--c:${a.color}">${icon(a.icon, { size: 14 })}</span>${esc(a.name)}</span></td>
      <td class="mono c-model">${esc(a.models.map(m => m.replace(/^claude-/, "")).join(", ") || "-")}</td>
      <td class="num">${a.runs}${a.done < a.runs ? ` <span class="muted">(${a.runs - a.done} not finished)</span>` : ""}</td>
      <td class="num">${duration(a.avg_seconds)}</td>
      <td class="c-bar"><div class="sbar" title="${duration(a.seconds)}"><i style="width:${(a.seconds / maxSec * 100).toFixed(1)}%"></i></div></td>
      <td class="num c-avg">${money(a.avg_cost)}</td>
      <td class="c-bar"><div class="sbar" title="${money(a.cost)}"><i style="width:${(a.cost / maxCost * 100).toFixed(1)}%"></i></div></td>
      <td class="num"><b>${money(a.cost)}</b></td></tr>`).join("")}
    </tbody></table></div>
    <nav class="pager compact" id="sPager" aria-label="Pages of agents">${pagerHTML(agentsPg, { noun: "agents" })}</nav>
    <h4 class="sec">Recent agent runs</h4>
    <div class="tbl-wrap"><table class="stable"><thead><tr><th>Agent</th><th class="c-req">Request</th><th class="num">Time</th><th class="num c-tok">Tokens</th><th class="num">Cost</th><th class="num">When</th></tr></thead><tbody>
    ${data.recent.map(e => `<tr>
      <td><span class="status-dot ${e.status}" title="${e.status}"></span>${esc(BY_ID[e.agent]?.name || e.agent)}</td>
      <td class="c-req" title="${esc(e.request || "")}" data-no-i18n>${esc(e.request || "")}</td>
      <td class="num">${duration(e.seconds || 0)}</td><td class="num c-tok">${compact((e.tokens_in || 0) + (e.tokens_out || 0))}</td>
      <td class="num">${e.cost ? money(e.cost) : "-"}</td><td class="num">${ago(e.ts)}</td></tr>`).join("")}
    </tbody></table></div>
    <nav class="pager compact" id="rPager" aria-label="Pages of agent runs">${data.recent_pager ? pagerHTML({ ...data.recent_pager, perPage: data.recent_pager.per_page }, { noun: "runs" }) : ""}</nav>`
    : `<p class="note">No agent has run in this project yet. Stats appear after the first run.</p>`}`;
  rPage = data.recent_pager?.page || 1;
  if ($("sPager")) bindPager($("sPager"), (p) => { sPage = p; loadStats(); }, (n) => { sPer = n; savePerPage("statsAgents", n); sPage = 1; loadStats(); });
  if ($("rPager")) bindPager($("rPager"), (p) => { rPage = p; loadStats(); }, (n) => { rPer = n; savePerPage("statsRuns", n); rPage = 1; loadStats(); });
}
// ---------- team presets
let presets = [];
async function loadPresets() { try { presets = await api("/api/presets"); } catch { presets = []; } }
function matchingPreset() {
  const cur = [...selected].sort().join(",");
  return presets.find(p => p.agents.length && [...p.agents].sort().join(",") === cur);
}
async function saveAsTeam() {
  const name = await promptDialog({ title: "Save as a team", label: "Team name", placeholder: "e.g. Landing page sprint", ok: "Save team", max: 40,
    text: `${selected.size} agents: ${AGENTS.filter(a => selected.has(a.id)).map(a => a.name).join(", ")}. It appears in My teams, ready for your other projects.` });
  if (!name) return;
  try { await api("/api/presets", { method: "POST", body: JSON.stringify({ name, agents: [...selected], scope: "mine" }) }); await loadPresets(); renderTeamHead(); toast(`Team “${name}” saved`); }
  catch (err) { toast(`Team “${name}” wasn't saved: ${err.message}`, "err"); }
}
