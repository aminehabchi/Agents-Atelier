# Agents Atelier with Docker: the app and Postgres.
#
#   cp .env.example .env              then set ADMIN_EMAIL (and SMTP_* to send real email)
#   docker compose up -d --build      start it: http://localhost:8001
#   docker compose logs -f app        follow the server log (email codes are printed here without SMTP)
#   docker compose down               stop it (your data stays in the volumes; add -v to delete it)
#
# Who pays for the agents (CLAUDE_KEYS in .env):
#   user (default)    every member adds their own Claude API key in their profile; the server's login is never used
#   server            a private install: everyone runs on this server's Claude Code login, made once with one of
#                       docker compose exec app claude              then type /login and follow the link
#                       CLAUDE_CODE_OAUTH_TOKEN=… in .env           a token from `claude setup-token`
#                       ANTHROPIC_API_KEY=… in .env                 an API key (billed per use)
name: agents-atelier

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-atelier}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atelier}
      POSTGRES_DB: ${POSTGRES_DB:-atelier}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"   # only this machine (so ./run.sh and manage.py can use it too)
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    image: agents-atelier
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      # these win over .env: inside the container the database is "db", and the app listens on every interface
      DATABASE_URL: postgresql://${POSTGRES_USER:-atelier}:${POSTGRES_PASSWORD:-atelier}@db:5432/${POSTGRES_DB:-atelier}
      HOST: 0.0.0.0
      PORT: 8001
      STORAGE_DIR: /data/storage
      ATELIER_WORK: /data/work
      CLAUDE_BIN: claude
      CLAUDE_CONFIG_DIR: /home/atelier/.claude
      CHROME_BIN: chromium
      CHROME_NO_SANDBOX: "true"
    ports:
      - "127.0.0.1:${APP_PORT:-8001}:8001"     # only this machine; put a reverse proxy with HTTPS in front to go public
    volumes:
      - ./storage:/data/storage                # every file: agents' instructions and projects (the same folder ./run.sh uses)
      - claude:/home/atelier/.claude           # Claude Code's login and settings
      # Upgrading from an earlier version? Uncomment to import the old work/ folder once (it's only read):
      # - ./work:/data/work:ro
    shm_size: 512mb                            # room for Chromium during browser checks

volumes:
  pgdata:          # the same database volume as database/docker-compose.yaml, so both ways of running share your data
  claude:
